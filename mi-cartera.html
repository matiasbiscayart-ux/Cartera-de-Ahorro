      h += '<div class="precio-caja" style="margin:0; padding:0; border:0">'
        + '<label for="dolar-hoy"><b style="color:var(--ink)">¿A cuánto está el dólar hoy?</b><br>Con esto valúo todo lo que tenés en dólares.</label>'
        + '<input id="dolar-hoy" class="precio-inp" type="text" inputmode="decimal" data-dolar="1" value="' + (E.dolar != null ? nf2.format(E.dolar) : '') + '" placeholder="1580" aria-label="Precio del dólar hoy">'
        + '</div>';
    }
    if (!AUTO.dolar) h += '</div>';
  }

  h += '<div class="pila">';
  var dl = tarjetaDolar();
  if (dl) h += dl;
  for (var i = 0; i < d.posiciones.length; i++) h += tarjetaTenencia(d.posiciones[i]);
  h += '</div>';
  return h;
}

/* De donde vienen los precios y de cuando son. Sin fuente configurada
   no dice nada: en ese caso la carga a mano es lo normal, no una falla. */
/* ══════════════ Tu resultado de verdad ══════════════

   La tarjeta que no trae ningún broker: el mismo resultado leído en
   pesos, en dólares, contra la inflación y contra un plazo fijo.
   Un broker te muestra la primera fila. Las otras tres son las que
   contestan si de verdad te fue bien. */

function filaResultado(etiqueta, dato, moneda, explicacion){
  if (!dato || !dato.hay){
    return '<div class="res-fila res-falta"><span class="res-etq">' + etiqueta + '</span>'
      + '<span class="res-nota">' + esc(explicacion || 'todavía no') + '</span></div>';
  }
  var v = (dato.ganancia != null) ? dato.ganancia : dato.diferencia;
  var pos = v >= 0;
  var cl = Math.abs(v) < 0.005 ? '' : (pos ? 'pos' : 'neg');
  var flecha = Math.abs(v) < 0.005 ? '' : (pos ? '▲ ' : '▼ ');
  var signo = pos ? '+' : '−';
  var abs = Math.abs(v);
  var plata = moneda === 'usd' ? dolares(abs) : pesos(abs);
  return '<div class="res-fila">'
    + '<span class="res-etq">' + etiqueta + '</span>'
    + '<span class="res-val ' + cl + '">' + flecha + signo + plata + '</span>'
    + '<span class="res-pct ' + cl + '">' + signo + pct(Math.abs(dato.pct)) + '</span>'
    + '</div>';
}

/* Cuanto se llevaron las comisiones en total. */
function bloqueComisiones(){
  var c = comisionesPagadas(E);
  if (!c.total || c.total < 1) return '';
  return '<div class="dato" style="border-top:1px solid var(--line); margin-top:8px; padding-top:11px">'
    + '<span>Pagaste de comisiones</span><span>' + pesos(c.total) + '</span></div>'
    + '<details class="explic"><summary>¿Es mucho o poco?</summary>'
    + '<p>En ' + c.operaciones + (c.operaciones === 1 ? ' operación' : ' operaciones')
    + ' llevás pagados <b>' + pesos2(c.total) + '</b>, que es el ' + pct(c.pctDeLoInvertido) + ' de lo que invertiste. '
    + 'No es un número para asustarse, pero sí para tener presente: cada vez que comprás y vendés, una parte queda en el camino. '
    + 'Comprar y quedarse quieto sale más barato que entrar y salir seguido.</p></details>';
}

/* Lo que cuesta la plata quieta. */
function bloqueQuieto(d){
  var q = costoDeEstarQuieto(d.efectivo, MUNDO.inflacion);
  if (!q || q.porMes < 1) return '';
  return '<div class="dato"><span>Lo que pierde por mes lo que está quieto</span>'
    + '<span class="neg">−' + pesos(q.porMes) + '</span></div>'
    + '<details class="explic"><summary>¿Por qué pierde si no lo toco?</summary>'
    + '<p>Porque los precios suben. El mes pasado subieron ' + pct(q.tasaMes) + ', así que con los '
    + pesos(d.efectivo) + ' que tenés sin invertir hoy comprás <b>' + pesos(q.porMes) + ' menos</b> de cosas que hace un mes. '
    + 'No es una proyección: es lo que ya pasó. Tener algo de plata a mano para una urgencia está bien; '
    + 'tener mucha quieta mucho tiempo tiene este costo.</p></details>';
}

/* El dolar de hoy en todas sus formas. Ya viene en la misma respuesta
   que usamos para valuar, asi que mostrarlo no cuesta nada, y es de lo
   primero que cualquiera en Argentina quiere saber. */
var CASAS_DOLAR = [
  ['oficial', 'Oficial'],
  ['blue', 'Blue'],
  ['bolsa', 'MEP'],
  ['contadoconliqui', 'Contado con liqui'],
  ['tarjeta', 'Tarjeta']
];

function tarjetaDolar(){
  var c = AUTO.dolarCasas;
  if (!c) return '';
  var filas = '', hubo = 0;
  for (var i = 0; i < CASAS_DOLAR.length; i++){
    var clave = CASAS_DOLAR[i][0], nom = CASAS_DOLAR[i][1];
    if (!c[clave]) continue;
    hubo++;
    var esElQueUsa = (clave === 'contadoconliqui');
    filas += '<div class="dato"><span>' + nom + (esElQueUsa ? ' <b style="color:var(--accent)">· el que uso</b>' : '') + '</span>'
      + '<span>' + pesos2(c[clave]) + '</span></div>';
  }
  if (!hubo) return '';
  return '<div class="tarjeta"><div class="rotulo">El dólar hoy</div>' + filas
    + '<details class="explic"><summary>¿Por qué hay tantos dólares?</summary>'
    + '<p><b>Oficial</b> es el del banco, con cupo y trámite. <b>Blue</b> es el informal. '
    + '<b>MEP</b> y <b>contado con liqui</b> son los que se compran por la bolsa, que es lo que hace tu broker: '
    + 'son legales y no tienen cupo. <b>Tarjeta</b> es el que te cobran cuando pagás en el exterior.<br><br>'
    + 'Para valuar uso el contado con liqui, porque es al que efectivamente podés comprar y vender por el broker.</p>'
    + '</details></div>';
}

/* ══════════════ Historicos: se piden cuando hacen falta ══════════════

   Cada serie pesa entre 90 y 300 KB. No se bajan al abrir la pagina:
   se bajan cuando alguien toca "¿y si hubieras comprado otra cosa?",
   que es una accion deliberada. Despues quedan en memoria. */
var HISTORICOS = {};      /* ticker -> {estado, serie} */
var REFERENCIAS = [
  {clave: 'SPY', nombre: 'El índice de EE.UU.', detalle: 'las 500 empresas más grandes, todas juntas'},
  {clave: 'QQQ', nombre: 'Las tecnológicas',    detalle: 'Apple, Microsoft, Nvidia y compañía, juntas'}
];
/* El oro y la plata no tienen historial en la fuente: la API contesta
   que no conoce el ticker. Si algun dia lo agrega, van aca. */

function traerHistorico(ticker){
  if (HISTORICOS[ticker]) return Promise.resolve(HISTORICOS[ticker]);
  HISTORICOS[ticker] = {estado: 'cargando', serie: []};
  return traer('https://data912.com/historical/cedears/' + ticker, 30)
    .then(function(t){
      var serie = leerHistorico(t);
      var salud = saludDeSerie(serie);
      HISTORICOS[ticker] = salud.sirve
        ? {estado: 'ok', serie: serie, salud: salud}
        : {estado: 'dudosa', serie: [], salud: salud};
      return HISTORICOS[ticker];
    })
    ['catch'](function(){
      HISTORICOS[ticker] = {estado: 'falla', serie: []};
      return HISTORICOS[ticker];
    });
}

/* Todo lo que hace falta para comparar una tenencia. */
function traerParaComparar(q){
  var pedidos = [traerHistorico(q.nombre)];
  for (var i = 0; i < REFERENCIAS.length; i++) pedidos.push(traerHistorico(REFERENCIAS[i].clave));
  return Promise.all(pedidos).then(function(){ render(); });
}

/* Las alternativas disponibles hoy, segun lo que se pudo traer. */
function alternativasPara(){
  var alts = [];
  for (var i = 0; i < REFERENCIAS.length; i++){
    var r = REFERENCIAS[i], h = HISTORICOS[r.clave];
    if (h && h.estado === 'ok') alts.push({nombre: r.nombre, detalle: r.detalle, tipo: 'serie', serie: h.serie});
  }
  if (MUNDO.cclSerie && MUNDO.cclSerie.length){
    alts.push({nombre: 'Comprar dólares', detalle: 'y guardarlos abajo del colchón', tipo: 'serie', serie: MUNDO.cclSerie});
  }
  if (MUNDO.tna){
    alts.push({nombre: 'Un plazo fijo', detalle: 'a la tasa de hoy, ' + pct(MUNDO.tna * 100) + ' anual', tipo: 'tasa', tna: MUNDO.tna});
  }
  return alts;
}

/* ══════════════ El bloque de comparacion de una tenencia ══════════════ */
var ABIERTAS = {};   /* clave -> true, para recordar cual esta desplegada */

function bloqueComparar(q){
  if (!q.tienePrecio) return '';
  var compras = comprasDe(E, q.clave);
  if (!compras.length) return '';

  if (!ABIERTAS[q.clave]){
    return '<div class="comparar-cerrado">'
      + '<button class="btn-comparar" data-acc="comparar" data-clave="' + esc(q.clave) + '">'
      + '¿Y si hubieras comprado otra cosa?</button></div>';
  }

  var propio = HISTORICOS[q.nombre];
  var cargando = (propio && propio.estado === 'cargando')
    || REFERENCIAS.some(function(r){ var h = HISTORICOS[r.clave]; return !h || h.estado === 'cargando'; });

  if (cargando){
    return '<div class="comparar-abierto"><p class="chico">Buscando cuánto valían las otras cosas esos días…</p></div>';
  }

  var h = '<div class="comparar-abierto">';
  var alts = alternativasPara();
  var comp = compararAlternativas(compras, q.valor, alts);

  if (!comp){
    h += '<p class="chico">No se pudo traer el historial para comparar. Probá más tarde.</p>';
  } else {
    h += tablaComparacion(comp, q);
  }

  if (propio && propio.estado === 'ok' && propio.serie.length > 30){
    h += graficoCompraste(propio.serie, compras, q);
    h += bloqueCaida(propio.serie, compras[0].fecha, q);
  } else if (propio && propio.estado === 'dudosa'){
    h += '<p class="chico" style="margin-top:10px">El historial de este papel tiene datos raros, así que no lo dibujo: prefiero no mostrarte un gráfico que miente.</p>';
  }

  h += '<button class="btn-texto" data-acc="comparar" data-clave="' + esc(q.clave) + '" style="margin-top:12px">Cerrar</button>';
  return h + '</div>';
}

/* La tabla: barras horizontales con etiqueta directa, ordenadas.
   Cinco filas con nombre al lado, asi que no hace falta leyenda. */
function tablaComparacion(comp, q){
  var maxv = comp.filas[0].valor;
  var h = '<p class="chico" style="margin-bottom:10px">Pusiste <b>' + pesos(comp.invertido)
    + '</b> en ' + esc(q.nombre) + ' desde el ' + fechaCorta(comp.desde)
    + '. Si esa misma plata, esos mismos días, hubiera ido a:</p>'
    + '<div class="comp-tabla">';

  for (var i = 0; i < comp.filas.length; i++){
    var f = comp.filas[i];
    var ancho = maxv > 0 ? (f.valor / maxv * 100) : 0;
    h += '<div class="comp-fila' + (f.esTuyo ? ' comp-tuyo' : '') + '">'
      + '<div class="comp-nom">' + esc(f.nombre) + (f.esTuyo ? '' : '<span class="comp-det">' + esc(f.detalle || '') + '</span>') + '</div>'
      + '<div class="comp-medida">'
      + '<div class="comp-barra"><i style="width:' + ancho.toFixed(1) + '%"></i></div>'
      + '<div class="comp-val">' + pesos(f.valor) + '</div></div>'
      + '</div>';
  }
  h += '</div>';

  if (comp.ganasteATodas){
    h += '<p class="res-frase">Le ganaste a todas las alternativas. Puede ser buen ojo o puede ser suerte: lo mismo mirado dentro de un año puede dar distinto.</p>';
  } else {
    var m = comp.mejorAlternativa;
    var dif = m.valor - comp.valorReal;
    h += '<p class="res-frase"><b>' + esc(m.nombre) + '</b> te hubiera dado <b>' + pesos(dif) + ' más</b>. '
      + 'No quiere decir que hayas elegido mal: quiere decir que en este período esa opción rindió más. '
      + 'Mirado en otro momento puede dar vuelta.</p>';
  }

  h += '<p class="chico" style="margin-top:9px">Es mirando para atrás, y sin contar impuestos ni las comisiones que también te cobrarían por comprar esas alternativas.</p>';
  return h;
}

/* ══════════════ El gráfico: "compraste acá" ══════════════

   Una sola serie, asi que el titulo la nombra y no hace falta leyenda.
   Los puntos de compra son la informacion: van marcados con un anillo
   del color de la superficie para que se despeguen de la linea. */
function graficoCompraste(serie, compras, q){
  var desde = compras[0].fecha;
  var pts = serie.filter(function(p){ return p.f >= desde; });
  /* Un poco de contexto antes de la primera compra ayuda a ver si
     compro caro o barato. */
  var iDesde = serie.findIndex ? serie.findIndex(function(p){ return p.f >= desde; }) : 0;
  if (iDesde > 30) pts = serie.slice(iDesde - 30);
  if (pts.length < 5) return '';

  var W = 600, H = 190, mI = 10, mD = 10, mT = 26, mB = 26;
  var vals = pts.map(function(p){ return p.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max === min){ max = max * 1.02 + 1; min = min * 0.98 - 1; }
  var x = function(i){ return mI + (i / (pts.length - 1)) * (W - mI - mD); };
  var y = function(v){ return mT + (1 - (v - min) / (max - min)) * (H - mT - mB); };
  var iDe = {};
  pts.forEach(function(p, i){ iDe[p.f] = i; });

  var linea = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  var area = linea + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H - mB) + ' L' + x(0).toFixed(1) + ' ' + (H - mB) + ' Z';
  var sube = pts[pts.length-1].v >= pts[0].v;
  var col = sube ? 'var(--pos)' : 'var(--neg)';

  /* Los puntos de compra, sobre el dia real o el mas cercano */
  var marcas = '';
  for (var k = 0; k < compras.length; k++){
    var f = compras[k].fecha, i = iDe[f];
    if (i == null){
      for (var d = 0; d < 6 && i == null; d++){
        var prev = new Date(f + 'T00:00:00'); prev.setDate(prev.getDate() - d);
        i = iDe[fechaISO(prev)];
      }
    }
    if (i == null) continue;
    marcas += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(pts[i].v).toFixed(1) + '" r="5.5" '
      + 'fill="var(--accent)" stroke="var(--card)" stroke-width="2"><title>Compraste el '
      + fechaCorta(f) + '</title></circle>';
  }

  return '<div class="graf-caja">'
    + '<div class="graf-tit">' + esc(q.nombre) + ' desde que lo comprás</div>'
    + '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Precio de ' + esc(q.nombre) + ' con tus compras marcadas">'
    + '<defs><linearGradient id="g-' + esc(q.nombre) + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.16"/>'
    + '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>'
    + '<path d="' + area + '" fill="url(#g-' + esc(q.nombre) + ')"/>'
    + '<path d="' + linea + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + marcas
    + '<text x="' + mI + '" y="14" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif">Máximo ' + pesos(max) + '</text>'
    + '<text x="' + (W - mD) + '" y="14" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif" text-anchor="end">Hoy ' + pesos(pts[pts.length-1].v) + '</text>'
    + '<text x="' + mI + '" y="' + (H - 8) + '" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif">' + fechaCorta(pts[0].f) + '</text>'
    + '<text x="' + (W - mD) + '" y="' + (H - 8) + '" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif" text-anchor="end">Mínimo ' + pesos(min) + '</text>'
    + '</svg>'
    + '<p class="chico">Los puntos son tus compras. Si están cerca de la parte de arriba, compraste caro.</p>'
    + '</div>';
}

/* ══════════════ ¿Cuánto puede bajar esto? ══════════════ */
function bloqueCaida(serie, desde, q){
  var c = peorCaida(serie, desde);
  if (!c || c.pct < 3) return '';
  return '<details class="explic" style="margin-top:12px"><summary>¿Cuánto puede bajar esto?</summary>'
    + '<p>Desde que lo comprás, <b>' + esc(q.nombre) + '</b> llegó a estar <b>' + pct(c.pct) + ' abajo</b> '
    + 'de su mejor momento, el ' + fechaCorta(c.fecha) + '. '
    + (c.recuperado
        ? 'Después se recuperó, pero mientras pasaba no había forma de saberlo.'
        : 'Todavía no volvió a ese máximo.')
    + '<br><br>No es una predicción de lo que va a pasar: es lo que ya pasó. '
    + 'Sirve para saber con qué te podés encontrar y no vender apurado el día que ocurra.</p></details>';
}

function tarjetaResultado(d){
  if (d.invertido <= 0) return '';
  var r = resultadoReal(E, d, contextoMundo());
  if (!r.pesos.hay) return '';

  var buscando = MUNDO.estado === 'cargando';
  var nota = buscando ? 'buscando…' : (enVistaPrevia() ? 'sólo en la página publicada' : 'no se pudo');

  var h = '<div class="tarjeta">'
    + '<div class="rotulo">Tu resultado, de cuatro formas</div>'
    + '<p class="chico" style="margin:7px 0 12px">Un broker te muestra la primera fila. Las otras tres son las que contestan si de verdad te fue bien.</p>'
    + '<div class="res-tabla">'
    + filaResultado('En pesos', r.pesos, 'ars')
    + filaResultado('En dólares', r.dolares, 'usd', nota)
    + filaResultado('Contra la inflación', r.inflacion, 'ars', nota)
    + filaResultado('Contra un plazo fijo', r.plazoFijo, 'ars', nota)
    + '</div>';

  /* La frase que resume, sólo cuando las dos primeras están */
  if (r.dolares.hay){
    var gp = r.pesos.ganancia >= 0, gd = r.dolares.ganancia >= 0;
    var frase;
    if (gp && !gd){
      frase = '<b>Ojo con esto:</b> en pesos tenés más plata que al principio, pero en dólares tenés menos. '
            + 'Quiere decir que tus inversiones subieron menos de lo que subió el dólar.';
    } else if (!gp && gd){
      frase = 'En pesos parece que perdiste, pero en dólares ganaste. El dólar bajó más de lo que bajaron tus inversiones.';
    } else if (gp && gd){
      frase = 'Ganaste en las dos monedas. Es el mejor de los casos: subiste más rápido que el dólar.';
    } else {
      frase = 'Por ahora perdés en las dos monedas. Puede cambiar: lo que muestra esta pantalla es hoy, no el final.';
    }
    h += '<p class="res-frase">' + frase + '</p>';
  }

  h += '<details class="explic"><summary>¿Qué significa cada fila?</summary><p>'
    + '<b>En pesos</b> es lo que te muestra tu broker: cuántos pesos más tenés que cuando empezaste.<br><br>'
    + '<b>En dólares</b> convierte cada compra con el dólar del día que la hiciste, y lo de hoy con el de hoy. '
    + 'Es la fila más importante en Argentina: podés tener 40% más pesos y menos dólares que antes.<br><br>'
    + '<b>Contra la inflación</b> responde si con tu plata comprás más cosas que antes o menos. '
    + 'Ganar 50% cuando todo aumentó 60% es perder.<br><br>'
    + '<b>Contra un plazo fijo</b> es qué hubiera pasado si esa misma plata, en las mismas fechas, hubiera estado quieta en el banco. '
    + 'Contesta si valió la pena el riesgo.'
    + (r.plazoFijo.hay ? ' Usa ' + pct(r.plazoFijo.tna * 100) + ' anual, la tasa del medio entre los bancos de hoy.' : '')
    + '</p></details>';

  if (r.inflacion.hay && r.inflacion.hasta){
    h += '<p class="chico" style="margin-top:9px">La inflación está publicada hasta ' + esc(fechaCorta(r.inflacion.hasta)) + '. Los meses posteriores todavía no salieron.</p>';
  }

  h += '</div>';
  return h;
}

function franjaPrecios(){
  if (AUTO.estado === 'sin-fuente') return '';

  if (AUTO.estado === 'cargando'){
    return '<div class="aviso" style="background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink)">'
      + '<span>Buscando los precios de hoy…</span></div>';
  }

  if (AUTO.estado === 'falla' && enVistaPrevia()){
    return '<div class="aviso"><span><b>Esto es una vista previa.</b> '
      + 'Acá no se pueden traer los precios de la bolsa porque el visor bloquea los pedidos a otros sitios. '
      + 'En la página publicada llegan solos; mientras tanto podés cargarlos a mano.</span></div>';
  }

  if (AUTO.estado === 'falla'){
    var hayViejos = AUTO.cuando != null;
    return '<div class="aviso"><span><b>No se pudieron traer los precios de hoy.</b> '
      + (hayViejos
          ? 'Estás viendo los últimos que llegaron bien, del ' + fechaCorta(fechaISO(AUTO.cuando)) + ' a las ' + horaCorta(AUTO.cuando) + '.'

function tarjetaTenencia(q){

    + '<span class="chip-clase" style="background:' + col + '; color:var(--chip-ink)">' + C.ico + '</span>'

    + '<div class="ten-sub">' + esc(C.nom) + ' · ' + nfU.format(q.cant) + ' ' + C.unidad + '</div></div>'
    + '<div class="ten-der">';

  if (q.tienePrecio){
    h += '<div class="ten-val">' + pesos(q.valor) + '</div>'
      + '<div class="ten-gan ' + cl + '">' + (pos ? '▲ +' : '▼ −') + pesos(Math.abs(gan)) + ' · ' + (pos ? '+' : '−') + pct(Math.abs(q.varPct)) + '</div>';
  } else {
    h += '<div class="ten-val">' + pesos(q.costo) + '</div><div class="ten-gan chico">Falta el precio</div>';

    h += '<div class="dato"><span>Hoy vale, en dólares</span><span>' + dolares(q.valorUSD) + '</span></div>';

  if (q.clase !== 'plazofijo'){
    h += '<div class="dato"><span>Te salió cada ' + esc(C.sing) + '</span><span>' + pesos2(q.ppc) + '</span></div>';
  }

  if (q.clase === 'plazofijo'){
    h += '<div class="dato"><span>Tasa anual</span><span>' + (q.tna ? pct(q.tna) : 'sin cargar') + '</span></div>';
    if (q.vence) h += '<div class="dato"><span>Vence</span><span>' + fechaCorta(q.vence) + '</span></div>';
    h += '<p class="chico" style="margin-top:9px">' + esc(q.auto || '') + '</p>';
  } else if (q.clase === 'dolar'){
    h += '<div class="dato"><span>Dólar hoy</span><span>' + (E.dolar ? pesos2(E.dolar) : 'cargalo arriba') + '</span></div>';
  } else if (precioDe(q.clave, {precios:{}}, AUTO) != null){
    h += '<div class="dato" style="border-top:1px solid var(--line); margin-top:11px; padding-top:11px">'
      + '<span>Precio de hoy</span><span>' + pesos2(precioDe(q.clave, {precios:{}}, AUTO)) + '</span></div>'
      + '<p class="chico" style="margin-top:6px">Llega solo, no hace falta que lo cargues.</p>';
  } else {
    var px = E.precios[q.clave];
    h += '<div class="precio-caja">'
      + '<label for="px-' + esc(q.clave) + '">¿A cuánto está hoy cada uno?<br><span style="font-size:12px">Lo ves en la app de tu banco o broker.</span></label>'
      + '<input id="px-' + esc(q.clave) + '" class="precio-inp" type="text" inputmode="decimal" data-precio="' + esc(q.clave) + '" value="' + (px != null ? nf2.format(px) : '') + '" placeholder="' + nf0.format(Math.round(q.ppc)) + '" aria-label="Precio de hoy de ' + esc(q.nombre) + '">'
      + '</div>';
  }

  h += bloqueComparar(q);
  h += '</div></div>';
  return h;
}

function vistaMovimientos(d){
  if (E.movimientos.length === 0){

      + '<p>Acá va quedando la lista de todo lo que hiciste: cada compra, cada venta y cada vez que pusiste o sacaste plata.</p></div></div>';
  }

  var movs = E.movimientos.slice().sort(function(a,b){ return String(b.fecha).localeCompare(String(a.fecha)); });
  var h = '<div class="pila"><div class="tarjeta">';

  for (var i = 0; i < movs.length; i++){
    var m = movs[i];
    var ico, col, tit, sub, val, vcl;

      sub = fechaCorta(m.fecha) + (m.nota ? ' · ' + m.nota : '');
      val = (entra ? '+' : '−') + pesos(m.total || 0);
      vcl = '';
    } else {
      var C = CLASES[m.clase] || CLASES.otro;
      var compra = m.tipo === 'compra';
      ico = compra ? '+' : '−'; col = 'var(' + C.col + ')';

      if (m.clase === 'plazofijo'){
        /* "150.000 × $1,00" no le dice nada a nadie: lo que importa
           es la plata que puso y a que tasa. */
        tit = (compra ? 'Pusiste en ' : 'Sacaste de ') + esc(m.nombre);
        sub = fechaCorta(m.fecha) + (m.tna ? ' · ' + pct(m.tna) + ' anual' : '')
            + (m.vence ? ' · vence ' + fechaCorta(m.vence) : '');
      } else if (m.clase === 'dolar'){
        tit = (compra ? 'Compraste dólares' : 'Vendiste dólares');
        sub = fechaCorta(m.fecha) + ' · ' + nfU.format(m.cantidad) + ' a $' + nf2.format(m.precio);
      } else {
        tit = (compra ? 'Compraste ' : 'Vendiste ') + esc(m.nombre);
        sub = fechaCorta(m.fecha) + ' · ' + nfU.format(m.cantidad) + ' × ' + (m.moneda === 'USD' ? 'US$' : '$') + nf2.format(m.precio);
      }
      val = (compra ? '−' : '+') + pesos(aPesos(m.total || 0, m, E));
      vcl = '';
    }

    h += '<div class="mov">'
      + '<span class="mov-ico" style="background:' + col + '; color:var(--chip-ink)">' + ico + '</span>'
      + '<div><div class="mov-tit">' + tit + '</div><div class="mov-sub">' + esc(sub) + '</div></div>'
      + '<span class="mov-val ' + vcl + '">' + val + '</span>'
      + '<button class="mov-x" data-acc="borrar" data-id="' + esc(m.id) + '" aria-label="Borrar este movimiento" title="Borrar">×</button>'
      + '</div>';
  }

  h += '</div></div>';
  return h;
}

/* ══════════════ Diálogos propios ══════════════
   El visor de páginas publicadas bloquea confirm(), prompt() y alert():
   quedan mudos y el botón no hace nada. Por eso van hechos a mano. */
var dialogo = null;
var acciones = {};

function preguntar(cfg){
  dialogo = cfg;
  pintarModal();
}

function pintarDialogo(){
  var d = dialogo;
  var h = '<div class="velo" data-acc="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="' + esc(d.titulo) + '">'
    + '<div class="hoja-cab"><span class="hoja-tit">' + esc(d.titulo) + '</span>'
    + '<button class="cerrar" data-acc="cerrar-dialogo" aria-label="Cerrar">×</button></div>'
    + '<p class="chico" style="line-height:1.65; margin-bottom:16px">' + esc(d.texto) + '</p>';

  if (d.tipo === 'texto'){
    h += '<div class="campo"><label for="f-pegar">' + esc(d.etiqueta || '') + '</label>'
      + '<textarea id="f-pegar" rows="6" style="font-size:13px; font-family:ui-monospace,monospace"></textarea></div>'
      + '<p id="error-dialogo" class="error" hidden></p>';
  }

  if (d.tipo === 'mostrar'){
    h += '<div class="campo"><textarea id="f-copia" rows="8" readonly '
      + 'style="font-size:12px; font-family:ui-monospace,monospace">' + esc(d.contenido || '') + '</textarea></div>';
  }

  h += '<div class="acciones" style="margin-top:4px">'
    + '<button class="btn' + (d.peligro ? ' btn-peligro' : '') + '" data-acc="dialogo-ok"'
    + (d.peligro ? ' style="background:var(--neg); color:var(--peligro-ink)"' : '') + '>' + esc(d.ok || 'Confirmar') + '</button>'
    + (d.tipo === 'mostrar' ? '' : '<button class="btn-fino" data-acc="cerrar-dialogo">Cancelar</button>')
    + '</div></div></div>';

  document.getElementById('modal').innerHTML = h;

  /* Deja el texto ya seleccionado: en el telefono ahorra el peor paso. */
  if (d.tipo === 'mostrar'){
    var caja = document.getElementById('f-copia');
    if (caja){ caja.focus(); caja.select(); }
  }
}

/* ══════════════ Alta guiada ══════════════ */
function abrirAlta(){
  dialogo = null;
  borrador = {paso:1, tipo:null, clase:null, moneda:'ARS', modoCom:'calcular', fecha:hoyISO(), error:null};
  pintarModal();
}

function cerrarAlta(){
  borrador = null;
  dialogo = null;
  document.getElementById('modal').innerHTML = '';
}

function pintarModal(){
  if (!borrador){
    if (dialogo) pintarDialogo();
    else document.getElementById('modal').innerHTML = '';
    return;
  }
  var b = borrador;
  var totalPasos = (b.tipo === 'ingreso' || b.tipo === 'retiro') ? 2 : 4;
  var barras = '';
  for (var i = 1; i <= totalPasos; i++) barras += '<i class="' + (i <= b.paso ? 'on' : '') + '"></i>';

  var cuerpo = '';
  if (b.paso === 1) cuerpo = pasoTipo();
  else if (b.tipo === 'ingreso' || b.tipo === 'retiro') cuerpo = pasoEfectivo();
  else if (b.paso === 2) cuerpo = pasoClase();
  else if (b.paso === 3) cuerpo = pasoDatos();
  else cuerpo = pasoConfirmar();

  document.getElementById('modal').innerHTML =
    '<div class="velo" data-acc="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="Agregar un movimiento">'
    + '<div class="hoja-cab">'
    + (b.paso > 1 ? '<button class="cerrar" data-w="atras" aria-label="Volver">‹</button>' : '')
    + '<span class="hoja-tit">' + tituloPaso() + '</span>'
    + '<button class="cerrar" data-w="cerrar" aria-label="Cerrar">×</button></div>'
    + '<div class="pasos">' + barras + '</div>'
    + (b.error ? '<p class="error">' + esc(b.error) + '</p>' : '')
    + cuerpo + '</div></div>';
}

function tituloPaso(){
  var b = borrador;
  if (b.paso === 1) return '¿Qué querés anotar?';
  if (b.tipo === 'ingreso') return 'Plata que entró';
  if (b.tipo === 'retiro') return 'Plata que sacaste';
  if (b.paso === 2) return '¿Qué ' + (b.tipo === 'compra' ? 'compraste' : 'vendiste') + '?';
  if (b.paso === 3) return 'Los datos de la operación';
  return 'Revisá que esté bien';
}

function opcion(attrs, ico, col, tit, desc, activo){
  return '<button class="opcion" ' + attrs + (activo ? ' aria-pressed="true"' : '') + '>'
    + '<span class="opcion-ico" style="background:' + col + '; color:var(--chip-ink)">' + ico + '</span>'
    + '<span><span class="opcion-tit">' + tit + '</span><span class="opcion-desc">' + desc + '</span></span></button>';
}

function pasoTipo(){
  return '<div class="opciones">'
    + opcion('data-w="tipo" data-val="compra"',  '+',  'var(--c1)', 'Compré algo',              'Un CEDEAR, dólares, un plazo fijo, cripto, lo que sea.')
    + opcion('data-w="tipo" data-val="venta"',   '−',  'var(--c6)', 'Vendí algo',               'Te desprendiste de algo que ya tenías cargado.')
    + opcion('data-w="tipo" data-val="ingreso"', '↓',  'var(--c5)', 'Puse plata en la cuenta',  'Transferiste plata a tu cuenta de inversión, pero todavía no compraste nada.')
    + opcion('data-w="tipo" data-val="retiro"',  '↑',  'var(--c7)', 'Saqué plata de la cuenta', 'Te llevaste plata de la cuenta de inversión al banco.')
    + '</div>';
}

function pasoClase(){
  var h = '<div class="opciones">';
  for (var i = 0; i < ORDEN_CLASES.length; i++){
    var k = ORDEN_CLASES[i], C = CLASES[k];
    h += opcion('data-w="clase" data-val="' + k + '"', C.ico, 'var(' + C.col + ')', esc(C.nom), esc(C.explica), borrador.clase === k);
  }
  return h + '</div>';
}

function pasoDatos(){
  var b = borrador, C = CLASES[b.clase];
  var h = '';

  if (b.clase === 'plazofijo'){
    h += campo('nombre', '¿En qué banco o billetera?', 'text', b.nombre || '', 'Por ejemplo: Banco Nación, Mercado Pago.');
    h += campo('monto', '¿Cuánta plata pusiste?', 'decimal', b.monto || '', 'En pesos.');
    h += '<div class="fila2">' + campo('tna', 'Tasa anual (TNA)', 'decimal', b.tna || '', 'El número que te mostró el banco, sin el signo %. Si no lo sabés, dejalo vacío.')
       + campo('vence', '¿Cuándo vence?', 'date', b.vence || '', 'Opcional.') + '</div>';
  } else if (b.clase === 'dolar'){
    h += campo('cantidad', '¿Cuántos dólares ' + (b.tipo === 'compra' ? 'compraste' : 'vendiste') + '?', 'decimal', b.cantidad || '', '');
    h += campo('precio', '¿A cuánto estaba el dólar?', 'decimal', b.precio || '', 'El precio en pesos de cada dólar, ese día.');
  } else {
    h += campo('nombre', '¿Cómo se llama?', 'text', b.nombre || '',
        b.clase === 'cedear' ? 'El símbolo que ves en tu broker: KO, NU, AAPL, MELI.' :
        b.clase === 'cripto' ? 'Por ejemplo: BTC, ETH, USDT.' :
        b.clase === 'fondo'  ? 'El nombre del fondo, como lo ves en tu app.' : 'Como quieras llamarlo.');
    h += '<div class="fila2">'
       + campo('cantidad', '¿Cuántos ' + C.unidad + '?', 'decimal', b.cantidad || '', '')
       + campo('precio', '¿A qué precio cada uno?', 'decimal', b.precio || '', '') + '</div>';
    if (C.monedaLibre){
      h += '<div class="campo"><label for="f-moneda">¿En qué moneda lo pagaste?</label>'
         + '<select id="f-moneda"><option value="ARS"' + (b.moneda === 'ARS' ? ' selected' : '') + '>Pesos</option>'
         + '<option value="USD"' + (b.moneda === 'USD' ? ' selected' : '') + '>Dólares</option></select></div>';
      if (b.moneda === 'USD') h += campo('dolarDia', '¿A cuánto estaba el dólar ese día?', 'decimal', b.dolarDia || '', 'Para poder mostrarte todo en pesos.');
    }
  }

  h += campo('fecha', '¿Qué día fue?', 'date', b.fecha, '');

  if (C.comision){
    var tas = tasasDe(E);
    h += '<div class="campo" style="margin-top:18px"><label>¿Te cobraron comisión?</label>'
       + '<div class="opciones" style="margin-top:6px">'
       + opcion('data-w="com" data-val="calcular"', '≈', 'var(--c1)', 'Calculala vos',
           'Usa ' + nf3.format(tas.comision) + '% + ' + nf3.format(tas.gastos) + '% sobre el monto. '
           + (tas.propias ? 'Son las que cargaste vos.' : 'Son las de una cuenta común: si tu broker cobra otra cosa, cambialas en «Qué es cada cosa».'),
           b.modoCom === 'calcular')
       + opcion('data-w="com" data-val="exacto"', '$', 'var(--c2)', 'Sé el importe exacto', 'Lo tenés en el comprobante de tu broker.', b.modoCom === 'exacto')
       + opcion('data-w="com" data-val="cero"', '0', 'var(--c7)', 'No me cobraron', 'Algunos brokers no cobran comisión.', b.modoCom === 'cero')
       + '</div></div>';
    if (b.modoCom === 'exacto') h += campo('comExacta', '¿Cuánto te cobraron en total?', 'decimal', b.comExacta || '', 'Comisión más gastos, todo junto.');
  }

  h += campo('nota', 'Una nota para acordarte (opcional)', 'text', b.nota || '', '');
  h += '<button class="btn ancho-total" data-w="siguiente" style="margin-top:6px">Continuar</button>';
  return h;
}

function pasoEfectivo(){
  var b = borrador;
  return campo('monto', '¿Cuánta plata ' + (b.tipo === 'ingreso' ? 'pusiste' : 'sacaste') + '?', 'decimal', b.monto || '', 'En pesos.')
    + campo('fecha', '¿Qué día fue?', 'date', b.fecha, '')
    + campo('nota', 'Una nota (opcional)', 'text', b.nota || '', 'Por ejemplo: sueldo, aguinaldo, ahorro del mes.')
    + '<button class="btn ancho-total" data-w="guardar" style="margin-top:6px">Guardar</button>';
}

function campo(id, etiqueta, tipo, valor, pista){
  var attrs = tipo === 'date' ? 'type="date"' : (tipo === 'decimal' ? 'type="text" inputmode="decimal"' : 'type="text"');
  return '<div class="campo"><label for="f-' + id + '">' + etiqueta + '</label>'
    + '<input id="f-' + id + '" ' + attrs + ' value="' + esc(valor) + '">'
    + (pista ? '<span class="pista">' + pista + '</span>' : '') + '</div>';
}

function pasoConfirmar(){
  var m = borrador.mov, C = CLASES[m.clase];
  var simb = m.moneda === 'USD' ? 'US$' : '$';
  var bruto = m.cantidad * m.precio;
  var compra = m.tipo === 'compra';
  var h = '<div class="resumen-op">';

  if (m.clase === 'plazofijo'){
    /* Un plazo fijo no tiene "precio de cada uno": se habla de plata
       puesta, tasa y cuanto vas a cobrar. */
    h += '<div class="dato"><span>' + (compra ? 'Ponés' : 'Sacás') + '</span><span>' + pesos2(bruto) + '</span></div>'
      + '<div class="dato"><span>En</span><span>' + esc(m.nombre) + '</span></div>';
    if (m.tna) h += '<div class="dato"><span>Tasa anual</span><span>' + pct(m.tna) + '</span></div>';
    if (m.vence) h += '<div class="dato"><span>Vence</span><span>' + fechaCorta(m.vence) + '</span></div>';
    if (m.tna && m.vence){
      var dias = diasEntre(m.fecha, m.vence);
      var alFinal = bruto * (1 + (m.tna / 100) * (dias / 365));
      h += '<div class="dato total"><span>Al vencimiento cobrás</span><span>' + pesos2(alFinal) + '</span></div>'
        + '<div class="dato"><span>Son ' + dias + ' días</span><span class="pos">+' + pesos2(alFinal - bruto) + '</span></div>';
    } else {
      h += '<div class="dato total"><span>' + (compra ? 'Te sale' : 'Cobrás') + '</span><span>' + pesos2(bruto) + '</span></div>';
    }
    h += '</div>';
    if (!m.tna){
      h += '<details class="explic"><summary>No cargaste la tasa</summary>'
        + '<p>Se puede guardar igual: mientras tanto el plazo fijo va a figurar por lo que pusiste, sin sumar intereses. Si después encontrás la tasa, cargalo de nuevo con el dato.</p></details>';
    }
    h += '<button class="btn ancho-total" data-w="guardar" style="margin-top:14px">Guardar</button>';
    return h;
  }

  if (m.clase === 'dolar'){
    h += '<div class="dato"><span>' + (compra ? 'Comprás' : 'Vendés') + '</span><span>' + nfU.format(m.cantidad) + ' dólares</span></div>'
      + '<div class="dato"><span>Con el dólar a</span><span>$' + nf2.format(m.precio) + '</span></div>'
      + '<div class="dato total"><span>' + (compra ? 'Te sale' : 'Cobrás') + '</span><span>' + pesos2(m.total) + '</span></div>'
      + '</div>'
      + '<button class="btn ancho-total" data-w="guardar" style="margin-top:14px">Guardar</button>';
    return h;
  }

  h += '<div class="dato"><span>' + (compra ? 'Comprás' : 'Vendés') + '</span><span>' + nfU.format(m.cantidad) + ' ' + esc(C.unidad) + ' de ' + esc(m.nombre) + '</span></div>'
    + '<div class="dato"><span>Precio de cada uno</span><span>' + simb + nf2.format(m.precio) + '</span></div>'
    + '<div class="dato"><span>Subtotal</span><span>' + simb + nf2.format(bruto) + '</span></div>';

  if (m.costos > 0){
    h += '<div class="dato"><span>' + (compra ? 'Comisión y gastos' : 'Comisión y gastos (se descuentan)') + '</span><span>' + (compra ? '+' : '−') + simb + nf2.format(m.costos) + '</span></div>';
  }
  h += '<div class="dato total"><span>' + (compra ? 'Te sale' : 'Cobrás') + '</span><span>' + simb + nf2.format(m.total) + '</span></div>';
  if (m.moneda === 'USD' && m.dolarDia){
    h += '<div class="dato"><span>En pesos, al dólar de ese día</span><span>' + pesos2(m.total * m.dolarDia) + '</span></div>';
  }
  h += '</div>';

  if (borrador.modoCom === 'calcular' && C.comision){
    h += '<details class="explic"><summary>¿De dónde salen esos costos?</summary>'
      + '<p>Se calculan como ' + nf3.format(tasasDe(E).comision) + '% de comisión más ' + nf3.format(tasasDe(E).gastos) + '% de gastos de mercado sobre el subtotal, redondeando igual que el broker. Es una estimación: si tu comprobante dice otra cosa, volvé atrás y cargá el importe exacto.</p></details>';
  }

  h += '<button class="btn ancho-total" data-w="guardar" style="margin-top:14px">Guardar</button>';
  return h;
}

/* Lee los inputs del paso 3 y arma el movimiento */
function leerDatos(){
  var b = borrador;
  var v = function(id){ var el = document.getElementById('f-' + id); return el ? el.value : ''; };

  /* Guarda lo tipeado en el borrador, asi si hay que volver a pintar la
     pantalla no se le borra lo que ya habia escrito. */
  leerDatosSuave();
  b.fecha = v('fecha') || hoyISO();
  b.nota = v('nota');

  var r = armarMovimiento({
    id: 'm' + Date.now(),
    tipo: b.tipo, clase: b.clase, moneda: b.moneda, modoCom: b.modoCom,
    fecha: b.fecha, nota: b.nota,
    nombre: v('nombre'), cantidad: v('cantidad'), precio: v('precio'),
    monto: v('monto'), tna: v('tna'), vence: v('vence'),
    dolarDia: v('dolarDia'), comExacta: v('comExacta')
  }, E, null, AUTO);

  if (!r.ok) return r.error;
  b.mov = r.mov;
  return null;
}

function guardarMov(){
  var m = borrador.mov;
  if (!m) return;
  E.movimientos.push(m);
  if (m.moneda === 'USD' && m.dolarDia && !E.dolar) E.dolar = m.dolarDia;
  guardar();
  cerrarAlta();
  vista = (m.tipo === 'ingreso' || m.tipo === 'retiro') ? 'movimientos' : 'inversiones';
  render();
}

/* ══════════════ Copia de seguridad ══════════════ */
function avisoCopia(txt){
  var el = document.getElementById('aviso-copia');
  if (el) el.textContent = txt;
}

function exportar(){
  var texto = JSON.stringify(E, null, 2);
  var nombre = 'mi-cartera-' + hoyISO() + '.json';
  if (window.claude && window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if (dl && dl.save){
        dl.save({filename:nombre, data:texto}).then(function(){
          avisoCopia('Listo, se guardó el archivo ' + nombre + '.');
        })['catch'](function(){ copiarAlPortapapeles(texto); });
      } else copiarAlPortapapeles(texto);
    })['catch'](function(){ copiarAlPortapapeles(texto); });
  } else {
    copiarAlPortapapeles(texto);
  }
}

function copiarAlPortapapeles(texto){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){
      avisoCopia('Copiado al portapapeles. Pegalo en una nota o un mail y guardalo: con ese texto podés restaurar todo.');
    })['catch'](function(){ mostrarParaCopiar(texto); });
  } else {
    mostrarParaCopiar(texto);
  }
}

/* Ultimo recurso, y el unico que no depende de permisos del navegador:
   se lo mostramos y que lo copie a mano. Nunca dejarlo sin salida. */
function mostrarParaCopiar(texto){
  avisoCopia('');
  preguntar({
    tipo:'mostrar',
    titulo:'Tu copia de seguridad',
    texto:'Este navegador no me deja guardarte el archivo ni copiar solo. El texto de abajo ya está seleccionado: copialo con Ctrl+C (o mantené apretado y "Copiar" en el teléfono) y guardalo en una nota o mandátelo por mail. Con eso restaurás todo.',
    contenido:texto,
    ok:'Listo',
    alAceptar:function(){}
  });
}

function importar(){
  preguntar({
    tipo:'texto',
    titulo:'Restaurar una copia',
    texto:'Pegá el texto que guardaste. Reemplaza todo lo que tengas cargado ahora en este navegador.',
    etiqueta:'El texto de la copia',
    ok:'Restaurar',
    alAceptar:function(){
      var el = document.getElementById('f-pegar');
      var err = document.getElementById('error-dialogo');
      var txt = el ? el.value : '';
      var r = leerCopia(txt);
      if (!r.ok){
        if (err){ err.textContent = r.motivo; err.hidden = false; }
        return false;
      }
      E = r.estado;
      guardar();
      dialogo = null;
      document.getElementById('modal').innerHTML = '';
      vista = 'resumen';
      render();
      if (r.descartados > 0){
        avisoCopia('Se restauraron ' + E.movimientos.length + ' movimientos. '
          + r.descartados + (r.descartados === 1 ? ' vino roto y no se pudo leer.' : ' vinieron rotos y no se pudieron leer.'));
      }
      return false;
    }
  });
}

/* ══════════════ Eventos ══════════════ */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-tab],[data-acc],[data-w]');
  if (!t) return;

  if (t.dataset.tab){ vista = t.dataset.tab; render(); window.scrollTo(0,0); return; }

  var w = t.dataset.w;
  if (w){
    if (w === 'cerrar'){ cerrarAlta(); return; }
    if (w === 'velo' && ev.target === t){ cerrarAlta(); return; }
    if (w === 'atras'){
      if (borrador.paso === 4){ borrador.paso = 3; borrador.error = null; pintarModal(); return; }
      borrador.paso = Math.max(1, borrador.paso - 1);
      borrador.error = null;
      pintarModal(); return;
    }
    if (w === 'tipo'){
      borrador.tipo = t.dataset.val;
      borrador.paso = 2;
      pintarModal(); return;
    }
    if (w === 'clase'){
      borrador.clase = t.dataset.val;
      if (borrador.clase === 'dolar') borrador.moneda = 'ARS';
      borrador.paso = 3;
      pintarModal(); return;
    }
    if (w === 'com'){
      var err0 = leerDatosSuave();
      borrador.modoCom = t.dataset.val;
      pintarModal(); return;
    }
    if (w === 'siguiente'){
      var err = leerDatos();
      if (err){ borrador.error = err; pintarModal(); return; }
      borrador.error = null; borrador.paso = 4; pintarModal(); return;
    }
    if (w === 'guardar'){
      if (borrador.tipo === 'ingreso' || borrador.tipo === 'retiro'){
        var e2 = leerDatos();
        if (e2){ borrador.error = e2; pintarModal(); return; }
      }
      guardarMov(); return;
    }
    return;
  }

  var a = t.dataset.acc;
  if (a === 'velo'){ if (ev.target === t) cerrarAlta(); return; }
  if (a === 'abrir-alta'){ abrirAlta(); return; }
  if (a === 'tema'){
    var actual = document.documentElement.getAttribute('data-theme');
    var oscuroAhora = actual ? actual === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', oscuroAhora ? 'light' : 'dark');
    try { localStorage.setItem('micartera_tema', oscuroAhora ? 'light' : 'dark'); } catch(e){}
    return;
  }
  if (a === 'comparar'){
    var cl = t.dataset.clave;
    if (ABIERTAS[cl]){ delete ABIERTAS[cl]; render(); return; }
    ABIERTAS[cl] = true;
    render();
    var pos = derivar(E, null, AUTO).posiciones.filter(function(x){ return x.clave === cl; })[0];
    if (pos) traerParaComparar(pos);
    return;
  }
  if (a === 'reintentar-precios'){ traerPrecios(); return; }
  if (a === 'tasas-reset'){ E.tasas = null; guardar(); render(); return; }
  if (a === 'exportar'){ exportar(); return; }
  if (a === 'importar'){ importar(); return; }

  if (a === 'cerrar-dialogo'){ dialogo = null; document.getElementById('modal').innerHTML = ''; return; }
  if (a === 'dialogo-ok'){
    var fn = dialogo && dialogo.alAceptar;
    if (!fn) return;
    var seguir = fn();
    if (seguir !== false){ dialogo = null; document.getElementById('modal').innerHTML = ''; }
    return;
  }

  if (a === 'borrar'){
    var idBorrar = t.dataset.id;
    preguntar({
      titulo:'Borrar el movimiento',
      texto:'Se va a borrar de la lista y las cuentas se recalculan sin él. No se puede deshacer.',
      ok:'Borrar', peligro:true,
      alAceptar:function(){
        E.movimientos = E.movimientos.filter(function(m){ return m.id !== idBorrar; });
        guardar(); render();
      }
    });
    return;
  }
  if (a === 'borrar-todo'){
    preguntar({
      titulo:'Borrar todo',
      texto:'Se borran todas tus inversiones, movimientos y precios de este navegador. Si no guardaste una copia antes, no hay forma de recuperarlos.',
      ok:'Borrar todo', peligro:true,
      alAceptar:function(){
        try { localStorage.removeItem(CLAVE_LS); } catch(e){}
        E = estadoVacio(); vista = 'resumen'; render();
      }
    });
    return;
  }
});

/* Guarda lo tipeado antes de repintar el modal al cambiar el modo de comisión */
function leerDatosSuave(){
  var b = borrador;
  var v = function(id){ var el = document.getElementById('f-' + id); return el ? el.value : undefined; };
  ['nombre','cantidad','precio','monto','tna','vence','fecha','nota','dolarDia','comExacta'].forEach(function(k){
    var val = v(k);
    if (val !== undefined) b[k] = val;
  });
  var s = document.getElementById('f-moneda');
  if (s) b.moneda = s.value;
}

document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.dataset && el.dataset.precio){
    var n = parseNum(el.value);
    if (isFinite(n) && n > 0) E.precios[el.dataset.precio] = n;
    else delete E.precios[el.dataset.precio];
    guardar(); render(); return;
  }
  if (el.dataset && el.dataset.tasa){
    var valor = parseNum(el.value);
    if (!E.tasas) E.tasas = {comision:TASAS_POR_DEFECTO.comision, gastos:TASAS_POR_DEFECTO.gastos};
    /* Un broker no cobra 30%: si escriben cualquier cosa, no la tomamos. */
    if (isFinite(valor) && valor >= 0 && valor <= 10) E.tasas[el.dataset.tasa] = valor;
    guardar(); render(); return;
  }
  if (el.dataset && el.dataset.dolar){
    var d = parseNum(el.value);
    E.dolar = (isFinite(d) && d > 0) ? d : null;
    guardar(); render(); return;
  }
  if (el.id === 'f-moneda' && borrador){
    leerDatosSuave();
    pintarModal();
  }
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && (borrador || dialogo)) cerrarAlta();
});

/* ══════════════ Arranque ══════════════ */
(function(){
  try {
    var tema = localStorage.getItem('micartera_tema');
    if (tema) document.documentElement.setAttribute('data-theme', tema);
  } catch(e){}

  E = leerLS() || estadoVacio();

  try { localStorage.setItem('micartera_test','1'); localStorage.removeItem('micartera_test'); }
  catch(e){ puedeGuardar = false; }

  render();
  anotarHist(derivar(E, null, AUTO));
  traerPrecios();
})();
</script>
