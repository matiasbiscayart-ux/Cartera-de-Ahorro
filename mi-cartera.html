<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Primera Cartera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#eef2f3; --card:#ffffff; --card-2:#f6fafa; --line:#d8e2e4;
  --ink:#152227; --muted:#5b7078;
  --accent:#0f6e78; --accent-ink:#ffffff; --accent-soft:#ddeef0; --accent-line:#a9d2d6;
  --pos:#006300; --neg:#d03b3b;
  --aviso-bg:#fdf4e3; --aviso-line:#e3c690; --aviso-ink:#6a4a12;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#898781;
  --chip-ink:#0b0b0b;
  --peligro-ink:#ffffff;
  --sombra:0 1px 2px rgba(16,40,45,.07), 0 6px 18px rgba(16,40,45,.05);
  --r:14px; --r-chico:9px;
  --ancho:660px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1518; --card:#182126; --card-2:#131b1f; --line:#2b383e;
    --ink:#e7eef0; --muted:#9aabb2;
    --accent:#4fc3cf; --accent-ink:#06232a; --accent-soft:#15323a; --accent-line:#2d5a64;
    --pos:#0ca30c; --neg:#e66767;
    --aviso-bg:#2b2312; --aviso-line:#5c4a1f; --aviso-ink:#ebd2a0;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --c5:#d55181; --c6:#008300; --c7:#898781;
    --chip-ink:#0b0b0b;
    --peligro-ink:#2a0d0d;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1518; --card:#182126; --card-2:#131b1f; --line:#2b383e;
  --ink:#e7eef0; --muted:#9aabb2;
  --accent:#4fc3cf; --accent-ink:#06232a; --accent-soft:#15323a; --accent-line:#2d5a64;
  --pos:#0ca30c; --neg:#e66767;
  --aviso-bg:#2b2312; --aviso-line:#5c4a1f; --aviso-ink:#ebd2a0;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#898781;
  --chip-ink:#0b0b0b;
  --peligro-ink:#2a0d0d;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
.num{font-variant-numeric:tabular-nums}

.envoltorio{max-width:var(--ancho); margin:0 auto; padding:0 16px 48px}

.barra{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
  margin:0 -16px; padding:0 16px;
}
.barra-fila{display:flex; align-items:center; gap:10px; padding:14px 0 10px}
.marca{font-family:'Fraunces', Georgia, serif; font-weight:600; font-size:19px; letter-spacing:-.01em; margin-right:auto}
.marca span{color:var(--accent)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; background:none; border:0; padding:9px 12px 12px;
  color:var(--muted); font-weight:500; font-size:14px;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;
}

.tarjeta{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--sombra)}
.pila{display:flex; flex-direction:column; gap:14px; margin-top:16px}
.rotulo{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}
.chico{font-size:13px; color:var(--muted)}

.aviso{
  background:var(--aviso-bg); border:1px solid var(--aviso-line); color:var(--aviso-ink);
  border-radius:var(--r-chico); padding:11px 13px; font-size:13.5px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px;
}
.aviso b{font-weight:600}
.aviso button{background:none; border:1px solid currentColor; border-radius:99px; padding:3px 11px; font-size:12.5px; font-weight:600; white-space:nowrap; margin-left:auto}

.hero{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 20px; box-shadow:var(--sombra); margin-top:16px}
.hero-cifra{
  font-family:'Fraunces', Georgia, serif; font-weight:600;
  font-size:clamp(36px, 10.5vw, 54px); line-height:1.02; letter-spacing:-.025em;
  margin:6px 0 2px; font-variant-numeric:tabular-nums;
}
.hero-usd{
  font-size:16.5px; font-weight:600; color:var(--muted);
  font-variant-numeric:tabular-nums; margin-top:2px;
}
.hero-usd span{font-weight:400; font-size:13px}
.hero-delta{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-top:8px; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.hero-frase{margin-top:15px; padding-top:15px; border-top:1px solid var(--line); font-size:14.5px; color:var(--muted); line-height:1.65}
.hero-frase b{color:var(--ink); font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.compo{display:flex; height:13px; border-radius:99px; overflow:hidden; gap:2px; margin:6px 0 14px; background:var(--card-2)}
.compo i{display:block; height:100%}
.leyenda-fila{display:grid; grid-template-columns:11px 1fr auto auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.leyenda-fila:last-child{border-bottom:0}
.punto{width:11px; height:11px; border-radius:3px}
.leyenda-nom{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.leyenda-pct{color:var(--muted); font-size:13px; min-width:44px; text-align:right; font-variant-numeric:tabular-nums}
.leyenda-val{min-width:90px; text-align:right; font-weight:500; font-variant-numeric:tabular-nums}

.ten{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sombra); overflow:hidden}
.ten-cab{display:flex; align-items:center; gap:11px; padding:15px 16px 13px}
.chip-clase{width:34px; height:34px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; font-size:11.5px; font-weight:700}
.ten-tit{font-weight:600; font-size:15.5px; line-height:1.25}
.ten-sub{font-size:12.5px; color:var(--muted)}
.ten-der{margin-left:auto; text-align:right; flex:0 0 auto}
.ten-val{font-weight:600; font-size:15.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.ten-gan{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.ten-cuerpo{border-top:1px solid var(--line); background:var(--card-2); padding:13px 16px}
.dato{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13.5px}
.dato span:first-child{color:var(--muted)}
.dato span:last-child{font-variant-numeric:tabular-nums; font-weight:500}
.precio-caja{display:flex; align-items:center; gap:9px; margin-top:12px; padding-top:11px; border-top:1px solid var(--line); flex-wrap:wrap}
.precio-caja label{font-size:13px; color:var(--muted); flex:1 1 160px}

input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-chico);
  padding:10px 11px; width:100%; font-size:16px; font-variant-numeric:tabular-nums;
}
.campo{display:flex; flex-direction:column; gap:5px; margin-bottom:14px}
.campo label{font-size:13.5px; font-weight:500}
.campo .pista{font-size:12.5px; color:var(--muted); line-height:1.45}
.fila2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
@media (max-width:430px){ .fila2{grid-template-columns:1fr} }
.precio-inp{width:132px; padding:7px 9px; font-size:14px}

.btn{background:var(--accent); color:var(--accent-ink); border:0; border-radius:var(--r-chico); padding:12px 17px; font-weight:600; font-size:15px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-fino{background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-chico); padding:10px 15px; font-weight:500; font-size:14px}
.btn-fino:hover{border-color:var(--accent-line)}
.btn-texto{background:none; border:0; color:var(--accent); font-weight:600; font-size:13.5px; padding:4px 0}
.btn-peligro{color:var(--neg)}
.acciones{display:flex; gap:9px; flex-wrap:wrap; margin-top:6px}
.ancho-total{width:100%; justify-content:center}

.btn-agregar{
  background:var(--accent); color:var(--accent-ink); border:0;
  border-radius:99px; padding:8px 15px; font-weight:600; font-size:14px;
  white-space:nowrap;
}

.explic{border:1px solid var(--line); border-radius:var(--r-chico); background:var(--card-2); overflow:hidden; margin-top:14px}
.explic summary{cursor:pointer; padding:10px 13px; font-size:13.5px; font-weight:500; color:var(--accent); list-style:none; display:flex; align-items:center; gap:8px}
.explic summary::-webkit-details-marker{display:none}
.explic summary::before{content:'?'; width:17px; height:17px; border-radius:99px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:11px; font-weight:700; flex:0 0 auto}
.explic[open] summary{border-bottom:1px solid var(--line)}
.explic p{padding:11px 13px; font-size:13.5px; color:var(--muted); line-height:1.6}

.mov{display:grid; grid-template-columns:auto 1fr auto auto; gap:11px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.mov-ico{width:31px; height:31px; border-radius:8px; display:grid; place-items:center; font-size:15px; font-weight:700}
.mov-tit{font-weight:500; font-size:14.5px}
.mov-sub{font-size:12.5px; color:var(--muted)}
.mov-val{text-align:right; font-weight:600; font-variant-numeric:tabular-nums; font-size:14.5px}
.mov-x{background:none; border:0; color:var(--muted); font-size:17px; line-height:1; padding:4px 2px}
.mov-x:hover{color:var(--neg)}

.graf{width:100%; height:auto; display:block; margin-top:4px}

.velo{position:fixed; inset:0; z-index:60; background:rgba(10,22,26,.5); display:flex; align-items:flex-end; justify-content:center}
.hoja{background:var(--bg); width:100%; max-width:var(--ancho); max-height:92vh; max-height:92dvh; overflow-y:auto; border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:0; padding:0 16px calc(24px + env(safe-area-inset-bottom, 0px))}
@media (min-width:560px){ .velo{align-items:center} .hoja{border-radius:20px; border-bottom:1px solid var(--line); max-height:88vh; max-height:88dvh} }
.hoja-cab{position:sticky; top:0; background:var(--bg); z-index:2; display:flex; align-items:center; gap:10px; padding:16px 0 12px; border-bottom:1px solid var(--line); margin-bottom:16px}
.hoja-tit{font-weight:600; font-size:16.5px; margin-right:auto}
.cerrar{background:var(--card); border:1px solid var(--line); border-radius:99px; width:31px; height:31px; font-size:16px; line-height:1; display:grid; place-items:center}
.pasos{display:flex; gap:5px; margin-bottom:16px}
.pasos i{flex:1; height:3px; border-radius:99px; background:var(--line)}
.pasos i.on{background:var(--accent)}
.opciones{display:flex; flex-direction:column; gap:9px}
.opcion{display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px}
.opcion:hover{border-color:var(--accent-line)}
.opcion[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opcion-ico{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:12px; font-weight:700; flex:0 0 auto}
.opcion-tit{display:block; font-weight:600; font-size:14.5px}
.opcion-desc{display:block; font-size:12.5px; color:var(--muted); line-height:1.45; margin-top:2px}
.resumen-op{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:14px}
.resumen-op .dato{padding:6px 0; font-size:14px}
.resumen-op .total{border-top:1px solid var(--line); margin-top:7px; padding-top:11px; font-weight:700; font-size:15.5px}
.error{color:var(--neg); font-size:13px; font-weight:500; margin-bottom:12px}

.res-tabla{display:flex; flex-direction:column}
.res-fila{
  display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:baseline;
  padding:11px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;
}
.res-fila:last-child{border-bottom:0}
.res-etq{font-size:14px; font-weight:500}
.res-val{font-size:15px; font-weight:600; white-space:nowrap}
.res-pct{font-size:13.5px; font-weight:600; min-width:58px; text-align:right; white-space:nowrap}
.res-falta .res-etq{color:var(--muted)}
.res-nota{font-size:13px; color:var(--muted); grid-column:2 / span 2; text-align:right}
.res-frase{
  margin-top:13px; padding:11px 13px; border-radius:var(--r-chico);
  background:var(--card-2); border:1px solid var(--line);
  font-size:13.5px; line-height:1.6; color:var(--muted);
}
.res-frase b{color:var(--ink)}
.comparar-cerrado{border-top:1px solid var(--line); margin-top:12px; padding-top:11px}
.btn-comparar{
  background:none; border:1px solid var(--accent-line); color:var(--accent);
  border-radius:var(--r-chico); padding:9px 14px; font-weight:600; font-size:13.5px;
  width:100%; text-align:center;
}
.btn-comparar:hover{background:var(--accent-soft)}
.comparar-abierto{border-top:1px solid var(--line); margin-top:12px; padding-top:13px}

.comp-tabla{display:flex; flex-direction:column; gap:9px; margin-bottom:12px}
.comp-fila{display:flex; flex-direction:column; gap:4px}
.comp-nom{font-size:13.5px; font-weight:500; display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.comp-det{font-size:12px; color:var(--muted); font-weight:400}
.comp-medida{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center}
.comp-barra{height:10px; border-radius:99px; background:var(--card-2); overflow:hidden}
.comp-barra i{display:block; height:100%; background:var(--c7); border-radius:99px}
.comp-val{font-size:13.5px; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:84px; text-align:right}
.comp-tuyo .comp-nom{font-weight:700}
.comp-tuyo .comp-barra i{background:var(--accent)}
.comp-tuyo .comp-val{font-weight:700}

.graf-caja{margin-top:14px}
.graf-tit{font-size:13px; font-weight:600; margin-bottom:4px}
.graf-caja .chico{margin-top:5px}
.vacio{text-align:center; padding:36px 18px; color:var(--muted)}
.vacio h3{font-family:'Fraunces',Georgia,serif; font-size:21px; color:var(--ink); margin-bottom:8px}
.vacio p{font-size:14px; line-height:1.6; max-width:38ch; margin:0 auto}

.glosario dt{font-weight:600; font-size:14.5px; margin-top:16px}
.glosario dd{margin:3px 0 0; font-size:13.5px; color:var(--muted); line-height:1.6}
.glosario dt:first-child{margin-top:0}

@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>

<div class="envoltorio">
  <div class="barra">
    <div class="barra-fila">
      <div class="marca">Mi <span>Cartera</span></div>
      <button class="btn-fino" data-acc="tema" aria-label="Cambiar entre modo claro y oscuro">Tema</button>
      <button class="btn-agregar" data-acc="abrir-alta">+ Agregar</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="resumen" aria-selected="true">Resumen</button>
      <button class="tab" role="tab" data-tab="inversiones" aria-selected="false">Mis inversiones</button>
      <button class="tab" role="tab" data-tab="movimientos" aria-selected="false">Movimientos</button>
      <button class="tab" role="tab" data-tab="ayuda" aria-selected="false">Qué es cada cosa</button>
    </div>
  </div>
  <main id="vista"></main>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   LA PLANILLA DE PRECIOS

   Poné acá la dirección del CSV publicado de la pestaña `api` de tu
   planilla (Archivo → Compartir → Publicar en la web → CSV).
   Cómo armarla: ver PRECIOS.md.

   Vacío = la página funciona igual, pero cada persona carga los
   precios a mano. Nada se rompe.

   OJO: el link publicado en claude.ai bloquea los pedidos a Google,
   así que esto sólo funciona si la página está hospedada en otro lado.
   ═══════════════════════════════════════════════════════════════ */
var FUENTE_PRECIOS = '';

/* ═══════════ LOGICA PURA — INICIO ═══════════
   Nada de acá toca el DOM, localStorage ni variables globales de estado:
   todo entra por parámetro y sale por return. El archivo de tests extrae
   este bloque del HTML real y lo corre en node, así se prueba el código
   que se publica y no una copia que se desactualiza. */

/* ══════════════ Formato y numeros ══════════════ */
var nf0 = new Intl.NumberFormat('es-AR', {maximumFractionDigits:0});
var nf2 = new Intl.NumberFormat('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
var nf1 = new Intl.NumberFormat('es-AR', {minimumFractionDigits:1, maximumFractionDigits:1});
var nfU = new Intl.NumberFormat('es-AR', {maximumFractionDigits:6});
var nf3 = new Intl.NumberFormat('es-AR', {maximumFractionDigits:3});

function pesos(n){ return '$' + nf0.format(Math.round(n || 0)); }
function pesos2(n){ return '$' + nf2.format(n || 0); }
function pct(n){ return nf1.format(n || 0) + '%'; }
/* Pocos dolares se muestran con centavos; muchos, redondeados. */
function dolares(n){
  var x = n || 0;
  return 'US$ ' + (Math.abs(x) < 100 ? nf2.format(x) : nf0.format(Math.round(x)));
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Acepta "1.234,56", "1234.56", "1234", "$1.234" */
function parseNum(s){
  if (typeof s === 'number') return s;
  if (s == null) return NaN;
  var t = String(s).trim().replace(/\s/g,'').replace(/^\$/,'');
  if (!t) return NaN;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,'');
  var n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}

/* Redondeo bancario (al digito par): el que usa el broker.
   374,945 -> 374,94   pero   135,315 -> 135,32 */
function redondear(n, dec){
  var f = Math.pow(10, dec == null ? 2 : dec);
  var x = n * f;
  var piso = Math.floor(x);
  var dif = x - piso;
  var r;
  if (Math.abs(dif - 0.5) < 1e-9) r = (piso % 2 === 0) ? piso : piso + 1;
  else r = Math.round(x);
  return r / f;
}

function hoyISO(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fechaCorta(iso){
  if (!iso) return '';
  var p = String(iso).split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0].slice(2);
}
function diasEntre(a, b){
  var d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if (isNaN(d1) || isNaN(d2)) return 0;
  return Math.max(0, Math.round((d2 - d1) / 86400000));
}

/* ══════════════ Catalogo de clases ══════════════ */
var CLASES = {
  cedear:    {nom:'CEDEAR',          ico:'CED', col:'--c1', unidad:'papeles',     sing:'papel',      comision:true,  explica:'Un pedacito de una empresa de afuera (Apple, Coca-Cola, Nu) que se compra y se vende en pesos, acá en Argentina.'},
  accion:    {nom:'Acción argentina',ico:'ACC', col:'--c3', unidad:'papeles',     sing:'papel',      comision:true,  explica:'Una parte de una empresa argentina que cotiza en la bolsa de acá.'},
  dolar:     {nom:'Dólares',         ico:'USD', col:'--c5', unidad:'dólares',     sing:'dólar',      comision:false, explica:'Dólares comprados en el banco, en el homebanking o en una billetera.'},
  plazofijo: {nom:'Plazo fijo',      ico:'PF',  col:'--c2', unidad:'pesos',       sing:'peso',       comision:false, explica:'Plata que le prestás al banco por un tiempo fijo a cambio de un interés pactado de antemano.'},
  fondo:     {nom:'Fondo común',     ico:'FCI', col:'--c4', unidad:'cuotapartes', sing:'cuotaparte', comision:false, explica:'Un fondo que junta la plata de mucha gente y la invierte por vos. El "money market" es el más común: rinde poco pero podés sacar la plata cuando querés.'},
  cripto:    {nom:'Cripto',          ico:'CRI', col:'--c6', unidad:'unidades',    sing:'unidad',     comision:false, monedaLibre:true, explica:'Bitcoin, Ethereum, o stablecoins como USDT que siguen al dólar.'},
  otro:      {nom:'Otra cosa',       ico:'···', col:'--c7', unidad:'unidades',    sing:'unidad',     comision:false, monedaLibre:true, explica:'Cualquier otra inversión que no entre en las anteriores.'}
};
var ORDEN_CLASES = ['cedear','dolar','plazofijo','fondo','accion','cripto','otro'];

/* Tasas del broker. La comisión está confirmada contra la grilla;
   la de gastos fue derivada de operaciones reales, no confirmada. */
/* Las que trae de fábrica. Están expresadas en por ciento porque es como
   las publica el broker y como las va a escribir la persona. */
var TASAS_POR_DEFECTO = {comision:0.45, gastos:0.155};

function estadoVacio(){
  return {v:1, movimientos:[], precios:{}, dolar:null, hist:[], tasas:null};
}

/* Las tasas de esta persona, o las de fábrica si nunca las tocó. */
function tasasDe(est){
  var t = est && est.tasas;
  /* Ojo: isFinite(null) da true porque null vale 0. Hay que exigir
     que sea un numero de verdad o un campo vacio se cuela como tasa. */
  var valida = function(x){ return typeof x === 'number' && isFinite(x) && x >= 0; };
  var com = (t && valida(t.comision)) ? t.comision : TASAS_POR_DEFECTO.comision;
  var gas = (t && valida(t.gastos)) ? t.gastos : TASAS_POR_DEFECTO.gastos;
  return {comision:com, gastos:gas, propias:!!t};
}

var TIPOS_MOV = ['compra','venta','ingreso','retiro'];

/* Revisa un movimiento venido de una copia y lo deja sano, o lo rechaza.
   Devuelve null si no se puede salvar. Nunca inventa datos que no estén:
   completa sólo lo que se puede deducir sin riesgo. */
function sanearMovimiento(m, indice){
  if (!m || typeof m !== 'object') return null;
  if (TIPOS_MOV.indexOf(m.tipo) < 0) return null;
  if (typeof m.fecha !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(m.fecha)) return null;

  var sano = {
    id: (typeof m.id === 'string' && m.id) ? m.id : ('m' + indice),
    fecha: m.fecha,
    tipo: m.tipo,
    nota: typeof m.nota === 'string' ? m.nota : ''
  };

  if (m.tipo === 'ingreso' || m.tipo === 'retiro'){
    var monto = Number(m.total);
    if (!isFinite(monto) || monto <= 0) return null;
    sano.total = monto;
    return sano;
  }

  if (!CLASES[m.clase]) return null;
  var cant = Number(m.cantidad), px = Number(m.precio);
  if (!isFinite(cant) || cant <= 0) return null;
  if (!isFinite(px) || px < 0) return null;

  var costos = Number(m.costos);
  costos = (isFinite(costos) && costos > 0) ? costos : 0;

  sano.clase = m.clase;
  sano.nombre = (typeof m.nombre === 'string' && m.nombre.trim()) ? m.nombre.trim() : CLASES[m.clase].nom;
  sano.cantidad = cant;
  sano.precio = px;
  sano.moneda = (m.moneda === 'USD') ? 'USD' : 'ARS';
  sano.costos = costos;

  var total = Number(m.total);
  sano.total = isFinite(total) ? total
             : (m.tipo === 'compra' ? cant * px + costos : cant * px - costos);

  if (isFinite(Number(m.dolarDia)) && Number(m.dolarDia) > 0) sano.dolarDia = Number(m.dolarDia);
  if (isFinite(Number(m.tna)) && Number(m.tna) > 0) sano.tna = Number(m.tna);
  if (typeof m.vence === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(m.vence)) sano.vence = m.vence;
  return sano;
}

/* Lee el texto de una copia. Devuelve {ok:true, estado, descartados} o
   {ok:false, motivo} con un motivo que se le pueda mostrar a la persona. */
function leerCopia(texto){
  var o;
  try { o = JSON.parse(texto); }
  catch(e){
    return {ok:false, motivo:'Ese texto está cortado o incompleto. Pegá todo, desde la primera llave { hasta la última }.'};
  }
  if (!o || typeof o !== 'object' || Array.isArray(o)){
    return {ok:false, motivo:'Eso no parece una copia de Mi Cartera.'};
  }
  if (!Array.isArray(o.movimientos)){
    return {ok:false, motivo:'Eso no parece una copia de Mi Cartera: no encuentro la lista de movimientos.'};
  }

  var buenos = [], descartados = 0;
  for (var i = 0; i < o.movimientos.length; i++){
    var sano = sanearMovimiento(o.movimientos[i], i);
    if (sano) buenos.push(sano); else descartados++;
  }
  if (o.movimientos.length > 0 && buenos.length === 0){
    return {ok:false, motivo:'Encontré la lista de movimientos pero ninguno se puede leer. Puede ser una copia de otra cosa.'};
  }

  var est = estadoVacio();
  est.movimientos = buenos;
  est.precios = (o.precios && typeof o.precios === 'object' && !Array.isArray(o.precios)) ? o.precios : {};
  est.dolar = (typeof o.dolar === 'number' && isFinite(o.dolar) && o.dolar > 0) ? o.dolar : null;
  est.hist = Array.isArray(o.hist) ? o.hist : [];
  est.tasas = (o.tasas && typeof o.tasas === 'object' && !Array.isArray(o.tasas)) ? o.tasas : null;

  return {ok:true, estado:est, descartados:descartados};
}

/* Comisión y gastos de una operación.
   modo: 'calcular' usa las tasas, 'exacto' toma el importe que pasaron,
   'cero' no cobra nada. Devuelve siempre un número redondeado.
   El redondeo se aplica a cada concepto por separado, que es como lo
   liquida el broker: redondear recién sobre la suma da distinto. */
function calcularCostos(bruto, clase, modo, importeExacto, tasas){
  var C = CLASES[clase];
  if (!C || !C.comision) return 0;
  if (modo === 'cero') return 0;
  if (modo === 'exacto'){
    var e = Number(importeExacto);
    return isFinite(e) && e >= 0 ? redondear(e, 2) : 0;
  }
  var t = tasas || TASAS_POR_DEFECTO;
  return redondear(redondear(bruto * t.comision / 100, 2) + redondear(bruto * t.gastos / 100, 2), 2);
}

/* ══════════════ Estado ══════════════ */
var CLAVE_LS = 'micartera_v1';
var E = null;

/* estado: 'sin-fuente' | 'cargando' | 'ok' | 'falla' */
var AUTO = {precios:{}, dolar:null, cuando:null, cuantos:0, estado:'sin-fuente'};
var CLAVE_CACHE = 'micartera_precios';

/* La ultima tanda que llego bien. Sirve para dos cosas: mostrar precios
   al instante mientras se busca la tanda nueva, y no quedarse sin nada
   si Google falla. */

    }));

/* ══════════════ Derivar la cartera ══════════════ */
function claveDe(m){ return m.clase + '|' + String(m.nombre || '').trim(); }

/* Pasa un importe a pesos. Si el movimiento fue en dólares usa el
   dólar del día que cargó la persona; si no lo cargó, el de hoy. */
function aPesos(monto, mov, est){
  if (!mov || mov.moneda !== 'USD') return monto;
  var d = mov.dolarDia || (est && est.dolar) || 0;
  return monto * d;
}

/* Cuánto puso y cuánto sacó de la cuenta, neto. */
function aportado(est){
  var t = 0;
  for (var i = 0; i < est.movimientos.length; i++){
    var m = est.movimientos[i];
    if (m.tipo === 'ingreso') t += (m.total || 0);
    if (m.tipo === 'retiro') t -= (m.total || 0);
  }
  return t;
}

/* est: el estado completo. hoy: fecha ISO contra la que se valúa
   (parámetro para que los tests no dependan del día que se corren). */
function derivar(est, hoy, auto){
  hoy = hoy || hoyISO();
  var pos = {};
  var efectivo = 0;
  var realizado = 0;

  var movs = est.movimientos.slice().sort(function(a,b){
    return String(a.fecha).localeCompare(String(b.fecha));
  });

  for (var i = 0; i < movs.length; i++){
    var m = movs[i];

    if (m.tipo === 'ingreso'){ efectivo += (m.total || 0); continue; }
    if (m.tipo === 'retiro'){ efectivo -= (m.total || 0); continue; }

    var k = claveDe(m);
    if (!pos[k]) pos[k] = {clave:k, clase:m.clase, nombre:m.nombre, cant:0, costo:0, moneda:m.moneda || 'ARS', tna:null, vence:null, desde:m.fecha};

    var p = pos[k];
    var bruto = (m.cantidad || 0) * (m.precio || 0);

    if (m.tipo === 'compra'){
      var salida = aPesos(bruto + (m.costos || 0), m, est);
      p.cant += (m.cantidad || 0);
      p.costo += salida;
      efectivo -= salida;
      if (m.tna) p.tna = m.tna;
      if (m.vence) p.vence = m.vence;
      if (m.moneda) p.moneda = m.moneda;
    } else if (m.tipo === 'venta'){
      /* Nunca se vende más de lo que hay: si el movimiento pide de más,
         se liquida lo que existe y se cobra sólo por eso. Los costos se
         prorratean igual, o la caja cierra mal. */
      var pedidas = m.cantidad || 0;
      var vendidas = Math.min(pedidas, p.cant);
      var proporcion = pedidas > 0 ? vendidas / pedidas : 0;
      var entrada = aPesos(vendidas * (m.precio || 0) - (m.costos || 0) * proporcion, m, est);
      var costoSalida = p.cant > 0 ? p.costo * (vendidas / p.cant) : 0;
      p.cant -= vendidas;
      p.costo -= costoSalida;
      if (p.cant < 1e-9){ p.cant = 0; p.costo = 0; }
      efectivo += entrada;
      realizado += entrada - costoSalida;
    }
  }

  var dol = dolarDe(est, auto);
  var lista = [];
  for (var key in pos){
    if (!Object.prototype.hasOwnProperty.call(pos, key)) continue;
    var q = pos[key];
    if (q.cant <= 1e-9) continue;

    q.ppc = q.costo / q.cant;
    var val = valuar(q, est, hoy, auto);
    q.valor = val.valor;
    q.tienePrecio = val.tiene;
    q.auto = val.auto;
    q.valorUSD = (dol && q.tienePrecio) ? q.valor / dol : null;
    q.ganancia = q.tienePrecio ? (q.valor - q.costo) : 0;
    q.varPct = (q.tienePrecio && q.costo > 0) ? (q.ganancia / q.costo * 100) : 0;
    lista.push(q);
  }

  lista.sort(function(a,b){ return (b.tienePrecio ? b.valor : b.costo) - (a.tienePrecio ? a.valor : a.costo); });

  var invertido = 0, valorHoy = 0, faltan = 0;
  for (var j = 0; j < lista.length; j++){
    invertido += lista[j].costo;
    valorHoy += lista[j].tienePrecio ? lista[j].valor : lista[j].costo;
    if (!lista[j].tienePrecio) faltan++;
  }

  return {
    posiciones: lista,
    invertido: invertido,
    valorHoy: valorHoy,
    ganancia: valorHoy - invertido,
    varPct: invertido > 0 ? ((valorHoy - invertido) / invertido * 100) : 0,
    efectivo: efectivo,
    realizado: realizado,
    faltanPrecios: faltan,
    aportado: aportado(est),
    /* La misma cartera leida en dolares. En Argentina esta es la
       diferencia entre creer que ganaste y haber ganado. */
    dolarHoy: dol,
    valorUSD: dol ? valorHoy / dol : null,
    efectivoUSD: dol ? efectivo / dol : null
  };
}

/* Cuánto vale hoy una posición.
   Devuelve tiene:false cuando falta el dato para valuarla, y en ese caso
   valor cae al costo — nunca inventa un precio. */
function valuar(q, est, hoy, auto){
  hoy = hoy || hoyISO();

  if (q.clase === 'plazofijo'){
    if (q.tna){
      /* Deja de devengar el día que vence. */
      var fin = (q.vence && q.vence < hoy) ? q.vence : hoy;
      var dias = diasEntre(q.desde, fin);
      return {valor: q.costo * (1 + (q.tna/100) * (dias/365)), tiene:true, auto:'Se calcula solo con la tasa y los días que pasaron'};
    }
    return {valor: q.costo, tiene:true, auto:'Sin tasa cargada: vale lo que pusiste'};
  }

  var dol = dolarDe(est, auto);

  if (q.clase === 'dolar'){
    if (dol) return {valor: q.cant * dol, tiene:true, auto:'Se calcula con el dólar de hoy'};
    return {valor: q.costo, tiene:false, auto:null};
  }

  var px = precioDe(q.clave, est, auto);
  if (px == null) return {valor: q.costo, tiene:false, auto:null};
  var v = q.cant * px;
  if (q.moneda === 'USD'){
    if (!dol) return {valor:q.costo, tiene:false, auto:null};
    v = v * dol;
  }
  return {valor:v, tiene:true, auto:null};
}

/* Busca una tenencia por clase y nombre sin distinguir mayusculas, para
   que "usdt" y "USDT" sean la misma cosa y no se partan en dos. */
function buscarPosicion(est, clase, nombre, hoy, auto){
  var d = derivar(est, hoy, auto);
  var buscado = String(nombre || '').trim().toLowerCase();
  for (var i = 0; i < d.posiciones.length; i++){
    var p = d.posiciones[i];
    if (p.clase === clase && String(p.nombre).trim().toLowerCase() === buscado) return p;
  }
  return null;
}

/* Revisa lo que cargo la persona y arma el movimiento, o devuelve el
   error en las palabras que se le van a mostrar.
   "datos" trae los campos tal como los escribio: todo texto. */
function armarMovimiento(datos, est, hoy, auto){
  var d = datos || {};
  var nota = typeof d.nota === 'string' ? d.nota : '';
  var fecha = d.fecha || hoyISO();
  var id = d.id || ('m' + Date.now());

  if (d.tipo === 'ingreso' || d.tipo === 'retiro'){
    var monto = parseNum(d.monto);
    if (!isFinite(monto) || monto <= 0) return {ok:false, error:'Escribí cuánta plata fue.'};
    return {ok:true, mov:{id:id, fecha:fecha, tipo:d.tipo, total:monto, nota:nota}};
  }
  if (d.tipo !== 'compra' && d.tipo !== 'venta') return {ok:false, error:'Elegí qué querés anotar.'};

  var C = CLASES[d.clase];
  if (!C) return {ok:false, error:'Elegí qué tipo de inversión es.'};

  /* Un CEDEAR o un plazo fijo son en pesos por definicion: la moneda
     solo se elige donde el catalogo lo permite. */
  var moneda = (C.monedaLibre && d.moneda === 'USD') ? 'USD' : 'ARS';
  var nombre, cantidad, precio, tna = null, vence = null;

  if (d.clase === 'plazofijo'){
    nombre = String(d.nombre || '').trim() || 'Plazo fijo';
    cantidad = parseNum(d.monto);
    precio = 1;
    moneda = 'ARS';
    if (!isFinite(cantidad) || cantidad <= 0) return {ok:false, error:'Escribí cuánta plata pusiste.'};
    var t = parseNum(d.tna);
    if (isFinite(t) && t > 0) tna = t;
    if (typeof d.vence === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.vence)) vence = d.vence;
  } else if (d.clase === 'dolar'){
    nombre = 'Dólares';
    cantidad = parseNum(d.cantidad);
    precio = parseNum(d.precio);
    moneda = 'ARS';
    if (!isFinite(cantidad) || cantidad <= 0) return {ok:false, error:'Escribí cuántos dólares fueron.'};
    if (!isFinite(precio) || precio <= 0) return {ok:false, error:'Escribí a cuánto estaba el dólar.'};
  } else {
    nombre = String(d.nombre || '').trim();
    if (!nombre) return {ok:false, error:'Ponele un nombre para poder identificarlo.'};
    cantidad = parseNum(d.cantidad);
    precio = parseNum(d.precio);
    if (!isFinite(cantidad) || cantidad <= 0) return {ok:false, error:'Escribí cuántos ' + C.unidad + ' fueron.'};
    if (!isFinite(precio) || precio <= 0) return {ok:false, error:'Escribí el precio de cada uno.'};
  }

  if (d.clase === 'cedear' || d.clase === 'accion') nombre = nombre.toUpperCase();

  var dolarDia = null;
  if (moneda === 'USD'){
    dolarDia = parseNum(d.dolarDia);
    if (!isFinite(dolarDia) || dolarDia <= 0) return {ok:false, error:'Necesito el dólar de ese día para mostrarte todo en pesos.'};
  }

  /* Si ya tiene esto cargado con otra combinacion de mayusculas,
     se usa el nombre que ya tenia para no partir la tenencia. */
  var yaTengo = buscarPosicion(est, d.clase, nombre, hoy, auto);
  if (yaTengo) nombre = yaTengo.nombre;

  if (d.tipo === 'venta'){
    if (!yaTengo) return {ok:false, error:'No encuentro «' + nombre + '» entre lo que tenés cargado. Revisá el nombre.'};
    if (cantidad > yaTengo.cant + 1e-9){
      return {ok:false, error:'Tenés ' + nfU.format(yaTengo.cant) + ' ' + C.unidad + ' de ' + nombre + ', no podés vender ' + nfU.format(cantidad) + '.'};
    }
  }

  var bruto = cantidad * precio;
  var exacta = null;
  if (C.comision && d.modoCom === 'exacto'){
    exacta = parseNum(d.comExacta);
    if (!isFinite(exacta) || exacta < 0) return {ok:false, error:'Escribí cuánto te cobraron, o elegí otra opción.'};
  }
  var costos = calcularCostos(bruto, d.clase, d.modoCom, exacta, tasasDe(est));

  var mov = {
    id:id, fecha:fecha, tipo:d.tipo, clase:d.clase, nombre:nombre,
    cantidad:cantidad, precio:precio, moneda:moneda, costos:costos,
    total:redondear(d.tipo === 'compra' ? bruto + costos : bruto - costos, 2),
    nota:nota
  };
  if (dolarDia) mov.dolarDia = dolarDia;
  if (tna) mov.tna = tna;
  if (vence) mov.vence = vence;
  return {ok:true, mov:mov};
}

/* ══════════════ Precios que llegan solos ══════════════ */

/* Parser de CSV chiquito. Entiende comillas y comas adentro de ellas,
   que es como Google exporta un numero formateado: dolar,"1.597,00" */
function parsearCSV(texto){
  var filas = [], fila = [], campo = '', dentro = false;
  var t = String(texto == null ? '' : texto).replace(/^\uFEFF/, '');
  for (var i = 0; i < t.length; i++){
    var c = t.charAt(i);
    if (dentro){
      if (c === '"'){
        if (t.charAt(i + 1) === '"'){ campo += '"'; i++; }
        else dentro = false;
      } else campo += c;
    } else if (c === '"'){
      dentro = true;
    } else if (c === ','){
      fila.push(campo); campo = '';
    } else if (c === '\n'){
      fila.push(campo); filas.push(fila); fila = []; campo = '';
    } else if (c !== '\r'){
      campo += c;
    }
  }
  if (campo !== '' || fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

/* Lee la tabla de precios publicada. Dos columnas: clave y precio.
   Ignora encabezados, filas vacias y cualquier cosa que no sea un
   numero positivo: una planilla a medio cargar no puede romper nada. */
function leerPrecios(csv){
  var filas = parsearCSV(csv);
  var r = {precios:{}, dolar:null, cuantos:0};
  for (var i = 0; i < filas.length; i++){
    var clave = String(filas[i][0] == null ? '' : filas[i][0]).trim();
    if (!clave || clave.toLowerCase() === 'clave') continue;
    var valor = parseNum(filas[i][1]);
    if (!isFinite(valor) || valor <= 0) continue;
    if (clave === 'dolar'){ r.dolar = valor; r.cuantos++; continue; }
    if (clave.indexOf('|') < 0) continue;      /* clave mal formada */
    r.precios[clave] = valor;
    r.cuantos++;
  }
  return r;
}

/* Mezcla la tanda nueva de precios sobre la anterior. Con una tabla de
   cientos de filas, Google devuelve #N/A en algunas de vez en cuando:
   si esta tanda no trajo un papel que la anterior si tenia, se conserva
   el de antes en vez de perderlo y dejar a la persona sin precio. */
function mezclarPrecios(previos, nuevos){
  var salida = {};
  var k;
  for (k in previos){ if (Object.prototype.hasOwnProperty.call(previos, k)) salida[k] = previos[k]; }
  for (k in nuevos){ if (Object.prototype.hasOwnProperty.call(nuevos, k)) salida[k] = nuevos[k]; }
  return salida;
}

/* Papeles que se pueden cargar como CEDEAR o como accion argentina y
   las dos estan bien: Mercado Libre, Globant, Vista y compañia cotizan
   aca y afuera. La tabla de precios los lista una sola vez; la pagina
   busca con los dos nombres para no depender de como los haya cargado
   cada persona. */
var CLASES_INTERCAMBIABLES = ['cedear', 'accion'];

function clavesEquivalentes(clave){
  var corte = clave.indexOf('|');
  if (corte < 0) return [clave];
  var clase = clave.slice(0, corte), resto = clave.slice(corte + 1);
  if (CLASES_INTERCAMBIABLES.indexOf(clase) < 0) return [clave];
  var salida = [clave];
  for (var i = 0; i < CLASES_INTERCAMBIABLES.length; i++){
    var otra = CLASES_INTERCAMBIABLES[i] + '|' + resto;
    if (otra !== clave) salida.push(otra);
  }
  return salida;
}

/* Precio de hoy de una tenencia. El automatico gana sobre el cargado a
   mano: es mas fresco y la persona no tiene que hacer nada. */
function precioDe(clave, est, auto){
  var opciones = clavesEquivalentes(clave), i;
  if (auto && auto.precios){
    for (i = 0; i < opciones.length; i++){
      if (auto.precios[opciones[i]] != null) return auto.precios[opciones[i]];
    }
  }
  for (i = 0; i < opciones.length; i++){
    var m = est.precios[opciones[i]];
    if (m != null && isFinite(m)) return m;
  }
  return null;
}

function dolarDe(est, auto){
  if (auto && auto.dolar) return auto.dolar;
  return est.dolar || null;
}

/* ══════════════ Datos del mundo real ══════════════
   Convierte lo que devuelven las fuentes publicas en algo que la pagina
   entiende. Funciones puras: entra el texto crudo, sale una estructura
   limpia, y si viene cualquier cosa devuelven vacio en vez de romper. */

/* dolarapi.com: las siete cotizaciones del dia */
function leerDolarApi(crudo){
  var lista;
  try { lista = (typeof crudo === 'string') ? JSON.parse(crudo) : crudo; }
  catch(e){ return null; }
  if (!lista || !lista.length) return null;
  var r = {cuando:null};
  for (var i = 0; i < lista.length; i++){
    var x = lista[i];
    var v = Number(x && x.venta);
    if (!isFinite(v) || v <= 0) continue;
    if (x.casa) r[x.casa] = v;
    if (x.fechaActualizacion && !r.cuando) r.cuando = x.fechaActualizacion;
  }
  /* El contado con liqui es el que corresponde para valuar CEDEARs y
     dolares comprados por el broker. Si no vino, cae al de bolsa. */
  r.ccl = r.contadoconliqui || r.bolsa || r.blue || r.oficial || null;
  return r.ccl ? r : null;
}

/* Series con forma [{fecha, valor}] o [{fecha, venta}] -> [{f, v}] */
function leerSerie(crudo, campo){
  var lista;
  try { lista = (typeof crudo === 'string') ? JSON.parse(crudo) : crudo; }
  catch(e){ return []; }
  if (!lista || !lista.length) return [];
  var out = [];
  for (var i = 0; i < lista.length; i++){
    var x = lista[i];
    if (!x || typeof x.fecha !== 'string') continue;
    var v = Number(x[campo]);
    if (!isFinite(v) || v <= 0) continue;
    out.push({f: x.fecha.slice(0, 10), v: v});
  }
  out.sort(function(a, b){ return a.f < b.f ? -1 : (a.f > b.f ? 1 : 0); });
  return out;
}

/* El valor de una serie en una fecha. Si ese dia no hay dato —un fin de
   semana, un feriado— toma el ultimo anterior, que es el que vale. */
function valorEnFecha(serie, fecha){
  if (!serie || !serie.length) return null;
  if (fecha < serie[0].f) return serie[0].v;
  var lo = 0, hi = serie.length - 1, mejor = null;
  while (lo <= hi){
    var m = (lo + hi) >> 1;
    if (serie[m].f <= fecha){ mejor = serie[m].v; lo = m + 1; }
    else hi = m - 1;
  }
  return mejor;
}

/* Cuanto subieron los precios entre dos fechas, como factor.
   0,25 significa que las cosas salen 25% mas caras que entonces. */
function inflacionEntre(serie, desde, hasta){
  if (!serie || !serie.length) return null;
  var factor = 1, hubo = false;
  for (var i = 0; i < serie.length; i++){
    var f = serie[i].f;
    if (f <= desde || f > hasta) continue;
    factor *= (1 + serie[i].v / 100);
    hubo = true;
  }
  return hubo ? factor - 1 : 0;
}

/* La tasa de plazo fijo del medio entre todos los bancos. Mediana y no
   promedio: un banco con una promocion rarisima no deberia mover la
   referencia de todos los demas. */
function medianaTNA(crudo){
  var lista;
  try { lista = (typeof crudo === 'string') ? JSON.parse(crudo) : crudo; }
  catch(e){ return null; }
  if (!lista || !lista.length) return null;
  var tasas = [];
  for (var i = 0; i < lista.length; i++){
    var t = Number(lista[i] && lista[i].tnaClientes);
    if (isFinite(t) && t > 0 && t < 3) tasas.push(t);
  }
  if (!tasas.length) return null;
  tasas.sort(function(a, b){ return a - b; });
  var m = Math.floor(tasas.length / 2);
  return tasas.length % 2 ? tasas[m] : (tasas[m-1] + tasas[m]) / 2;
}

/* data912.com: precios en vivo de la bolsa de aca.
   c = ultimo operado; si no hay, el promedio entre las dos puntas. */
function leerData912(crudo, clase){
  var lista;
  try { lista = (typeof crudo === 'string') ? JSON.parse(crudo) : crudo; }
  catch(e){ return {}; }
  if (!lista || !lista.length) return {};
  var out = {};
  for (var i = 0; i < lista.length; i++){
    var x = lista[i];
    if (!x || typeof x.symbol !== 'string' || !x.symbol) continue;
    var px = Number(x.c);
    if (!isFinite(px) || px <= 0){
      var b = Number(x.px_bid), a = Number(x.px_ask);
      if (isFinite(b) && isFinite(a) && b > 0 && a > 0) px = (b + a) / 2;
    }
    if (!isFinite(px) || px <= 0) continue;
    out[clase + '|' + x.symbol.trim().toUpperCase()] = px;
  }
  return out;
}

/* Lo que se llevaron las comisiones. Casi nadie lo tiene presente y
   sumado da numeros que sorprenden. */
function comisionesPagadas(est){
  var total = 0, cuantas = 0, invertido = 0;
  for (var i = 0; i < est.movimientos.length; i++){
    var m = est.movimientos[i];
    if (m.tipo !== 'compra' && m.tipo !== 'venta') continue;
    var c = Number(m.costos) || 0;
    if (m.moneda === 'USD') c = c * (m.dolarDia || 0);
    if (c > 0){ total += c; cuantas++; }
    if (m.tipo === 'compra') invertido += (m.cantidad || 0) * (m.precio || 0) * (m.moneda === 'USD' ? (m.dolarDia || 0) : 1);
  }
  return {
    total: total, operaciones: cuantas,
    pctDeLoInvertido: invertido > 0 ? total / invertido * 100 : 0
  };
}

/* Lo que cuesta tener plata quieta. La inflacion del ultimo mes
   publicado aplicada al efectivo sin invertir: no es una proyeccion,
   es lo que ya paso el mes pasado. */
function costoDeEstarQuieto(efectivo, inflacion){
  if (!efectivo || efectivo <= 0) return null;
  if (!inflacion || !inflacion.length) return null;
  var ultimo = inflacion[inflacion.length - 1];
  if (!ultimo || !(ultimo.v > 0)) return null;
  return {
    porMes: efectivo * (ultimo.v / 100),
    tasaMes: ultimo.v,
    mes: ultimo.f
  };
}

/* ══════════════ Tu resultado, de cuatro formas ══════════════

   Lo que ningun broker muestra: el mismo resultado leido en pesos, en
   dolares, contra la inflacion y contra un plazo fijo.

   Cada compra se convierte con el dato de SU dia, no con el de hoy.
   Convertir todo al dolar de hoy da cero informacion porque se cancela
   y devuelve el mismo porcentaje que en pesos. */
function resultadoReal(est, d, ctx){
  ctx = ctx || {};
  var hoy = ctx.hoy || hoyISO();
  var r = {
    pesos:     {invertido: d.invertido, valor: d.valorHoy, hay: d.invertido > 0},
    dolares:   {hay: false},
    inflacion: {hay: false},
    plazoFijo: {hay: false},
    faltaDato: []
  };
  if (!r.pesos.hay) return r;

  r.pesos.ganancia = d.valorHoy - d.invertido;
  r.pesos.pct = (d.valorHoy - d.invertido) / d.invertido * 100;

  var compras = [];
  for (var i = 0; i < est.movimientos.length; i++){
    var m = est.movimientos[i];
    if (m.tipo !== 'compra') continue;
    var bruto = (m.cantidad || 0) * (m.precio || 0) + (m.costos || 0);
    var enPesos = (m.moneda === 'USD') ? bruto * (m.dolarDia || ctx.cclHoy || 0) : bruto;
    if (enPesos > 0) compras.push({fecha: m.fecha, ars: enPesos});
  }
  if (!compras.length) return r;

  /* ── En dolares ── */
  if (ctx.cclHoy && ctx.cclSerie && ctx.cclSerie.length){
    var costoUSD = 0, todas = true;
    for (var j = 0; j < compras.length; j++){
      var cclEse = valorEnFecha(ctx.cclSerie, compras[j].fecha);
      if (!cclEse){ todas = false; break; }
      costoUSD += compras[j].ars / cclEse;
    }
    if (todas && costoUSD > 0){
      var valorUSD = d.valorHoy / ctx.cclHoy;
      r.dolares = {
        hay: true, invertido: costoUSD, valor: valorUSD,
        ganancia: valorUSD - costoUSD,
        pct: (valorUSD - costoUSD) / costoUSD * 100
      };
    } else r.faltaDato.push('dolares');
  } else r.faltaDato.push('dolares');

  /* ── Contra la inflacion ── */
  if (ctx.inflacion && ctx.inflacion.length){
    var ajustado = 0, completo = true;
    for (var k = 0; k < compras.length; k++){
      var subida = inflacionEntre(ctx.inflacion, compras[k].fecha, hoy);
      if (subida == null){ completo = false; break; }
      ajustado += compras[k].ars * (1 + subida);
    }
    if (completo && ajustado > 0){
      r.inflacion = {
        hay: true, equivalente: ajustado,
        ganancia: d.valorHoy - ajustado,
        pct: (d.valorHoy - ajustado) / ajustado * 100,
        hasta: ctx.inflacion[ctx.inflacion.length - 1].f
      };
    } else r.faltaDato.push('inflacion');
  } else r.faltaDato.push('inflacion');

  /* ── Contra un plazo fijo ── */
  if (ctx.tna){
    var alternativa = 0;
    for (var n = 0; n < compras.length; n++){
      var dias = diasEntre(compras[n].fecha, hoy);
      alternativa += compras[n].ars * (1 + ctx.tna * (dias / 365));
    }
    if (alternativa > 0){
      r.plazoFijo = {
        hay: true, tna: ctx.tna, equivalente: alternativa,
        diferencia: d.valorHoy - alternativa,
        pct: (d.valorHoy - alternativa) / alternativa * 100
      };
    }
  } else r.faltaDato.push('plazoFijo');

  return r;
}

/* ══════════════ ¿Y si hubieras comprado otra cosa? ══════════════

   La pregunta que ningun broker contesta, porque no le conviene.

   El metodo: cada compra se replica en el activo alternativo al precio
   que ESE activo tenia ESE dia. No hay una fecha de arranque comun: los
   pesos que pusiste en junio compiten cuatro meses, los de agosto dos.
   Esa es la unica forma honesta de compararlo. */

/* data912 devuelve velas diarias: {date, o, h, l, c, v}. Nos alcanza el
   cierre. */
function leerHistorico(crudo){
  var lista;
  try { lista = (typeof crudo === 'string') ? JSON.parse(crudo) : crudo; }
  catch(e){ return []; }
  if (!lista || !lista.length) return [];
  var out = [];
  for (var i = 0; i < lista.length; i++){
    var x = lista[i];
    if (!x || typeof x.date !== 'string') continue;
    var c = Number(x.c);
    if (!isFinite(c) || c <= 0) continue;
    out.push({f: x.date.slice(0, 10), v: c});
  }
  out.sort(function(a, b){ return a.f < b.f ? -1 : (a.f > b.f ? 1 : 0); });
  return limpiarSerie(out);
}

/* ══════════════ Limpiar una serie de precios ══════════════

   Las series de la bolsa vienen crudas y traen dos problemas que, sin
   arreglar, hacen mentir cualquier comparacion:

   1. SPLITS. Cuando a un CEDEAR le cambian el ratio, el precio cae a la
      mitad, a un tercio o a un decimo de un dia para el otro sin que el
      papel haya perdido un peso. El SPY paso de $56.000 a $18.760 el
      29/05/2026: un split 3 a 1. Leido crudo, parece una caida del 67%.

   2. PRECIOS MAL CARGADOS. Un dia suelto con un valor absurdo que al dia
      siguiente vuelve a la normalidad. El 03/08/2023 el SPY figura a
      $7.560 entre dos dias de $12.800.

   Se arreglan distinto: el dato malo se descarta, el split se ajusta
   hacia atras para que toda la serie quede en la misma unidad. */

/* Factores de split que se usan en la practica. Se aceptan tambien sus
   inversos, para los splits al reves (contrasplits). */
var FACTORES_SPLIT = [2, 2.5, 3, 4, 5, 6, 8, 10, 12, 15, 16, 20, 24, 25, 30, 40, 50, 60, 75, 100, 120, 144];

/* ¿Este cambio de precio se explica por un split? Devuelve el factor o
   null. Se exige que sea muy cercano a un factor redondo: un derrumbe
   de verdad casi nunca cae exactamente a un tercio. */
function factorDeSplit(antes, despues){
  if (!(antes > 0) || !(despues > 0)) return null;
  var r = antes / despues;
  for (var i = 0; i < FACTORES_SPLIT.length; i++){
    var f = FACTORES_SPLIT[i];
    if (Math.abs(r / f - 1) < 0.04) return f;          /* precio cae: 3 a 1 */
    if (Math.abs(r * f - 1) < 0.04) return 1 / f;      /* precio sube: 1 a 3 */
  }
  return null;
}

function limpiarSerie(serie){
  if (!serie || serie.length < 3) return serie || [];

  /* ── 1. Sacar los dias sueltos con precio absurdo ── */
  var sano = [serie[0]];
  for (var i = 1; i < serie.length - 1; i++){
    var ant = serie[i-1].v, act = serie[i].v, sig = serie[i+1].v;
    var saltaIda = Math.abs(act / ant - 1) > 0.25;
    var saltaVuelta = Math.abs(act / sig - 1) > 0.25;
    var vecinosParecidos = Math.abs(ant / sig - 1) < 0.15;
    /* Salta y vuelve, con los vecinos de acuerdo: es un dato malo. */
    if (saltaIda && saltaVuelta && vecinosParecidos) continue;
    sano.push(serie[i]);
  }
  sano.push(serie[serie.length - 1]);

  /* ── 2. Encontrar los splits, SOBRE LA SERIE CRUDA ──
     En dos pasadas y no en una: si se ajusta mientras se recorre, cada
     split ya corregido genera splits fantasma al comparar un precio
     crudo contra uno ajustado. */
  var cortes = [];
  for (var j = 1; j < sano.length; j++){
    if (Math.abs(sano[j].v / sano[j-1].v - 1) <= 0.30) continue;
    var f = factorDeSplit(sano[j-1].v, sano[j].v);
    if (f) cortes.push({i: j, fecha: sano[j].f, factor: f});
  }

  /* ── 3. Aplicar el ajuste hacia atras ──
     Todo lo anterior a un split se lleva a la unidad nueva, para que la
     serie entera quede comparable de punta a punta. */
  var salida = sano.map(function(p){ return {f: p.f, v: p.v}; });
  for (var k = cortes.length - 1; k >= 0; k--){
    var c = cortes[k];
    for (var m = 0; m < c.i; m++) salida[m].v = salida[m].v / c.factor;
  }

  salida.ajustes = cortes.map(function(c){ return {fecha: c.fecha, factor: c.factor}; });
  salida.descartados = serie.length - sano.length;
  return salida;
}

/* ¿Que tan confiable es esta serie? Sirve para decidir si mostrar la
   comparacion o callarse. */
function saludDeSerie(serie){
  if (!serie || serie.length < 30) return {sirve: false, motivo: 'muy corta'};
  var saltos = 0;
  for (var i = 1; i < serie.length; i++){
    if (serie[i-1].v > 0 && Math.abs(serie[i].v / serie[i-1].v - 1) > 0.30) saltos++;
  }
  /* Despues de limpiar no deberia quedar ninguno. Si quedan varios, la
     serie tiene algo raro que no entendemos y es mejor no usarla. */
  if (saltos > 2) return {sirve: false, motivo: 'tiene ' + saltos + ' saltos sin explicar'};
  return {sirve: true, dias: serie.length, saltos: saltos};
}

/* Las compras de una tenencia, en pesos y con fecha. */
function comprasDe(est, clave){
  var salida = [];
  for (var i = 0; i < est.movimientos.length; i++){
    var m = est.movimientos[i];
    if (m.tipo !== 'compra') continue;
    if (clave && claveDe(m) !== clave) continue;
    var bruto = (m.cantidad || 0) * (m.precio || 0) + (m.costos || 0);
    var ars = (m.moneda === 'USD') ? bruto * (m.dolarDia || 0) : bruto;
    if (ars > 0) salida.push({fecha: m.fecha, ars: ars, cantidad: m.cantidad || 0});
  }
  salida.sort(function(a, b){ return a.fecha < b.fecha ? -1 : 1; });
  return salida;
}

/* Que hubiera pasado con esa misma plata en otra cosa.
   alt: {tipo:'serie', serie:[{f,v}]} o {tipo:'tasa', tna:0.195} */
function simularAlternativa(compras, alt, hoy){
  if (!compras || !compras.length || !alt) return null;
  hoy = hoy || hoyISO();
  var invertido = 0, valor = 0;

  if (alt.tipo === 'tasa'){
    if (!(alt.tna > 0)) return null;
    for (var i = 0; i < compras.length; i++){
      var dias = diasEntre(compras[i].fecha, hoy);
      invertido += compras[i].ars;
      valor += compras[i].ars * (1 + alt.tna * (dias / 365));
    }
    return {invertido: invertido, valor: valor};
  }

  if (!alt.serie || !alt.serie.length) return null;
  var precioHoy = valorEnFecha(alt.serie, hoy);
  if (!precioHoy) return null;

  for (var j = 0; j < compras.length; j++){
    var px = valorEnFecha(alt.serie, compras[j].fecha);
    /* Si la serie no llega tan atras no se inventa: se descarta entera,
       porque una comparacion a medias es peor que ninguna. */
    if (!px) return null;
    invertido += compras[j].ars;
    valor += (compras[j].ars / px) * precioHoy;
  }
  return {invertido: invertido, valor: valor};
}

/* La tabla completa: lo que hiciste contra cada alternativa. */
function compararAlternativas(compras, valorReal, alternativas, hoy){
  if (!compras || !compras.length || !(valorReal > 0)) return null;
  var filas = [];
  for (var i = 0; i < alternativas.length; i++){
    var a = alternativas[i];
    var r = simularAlternativa(compras, a, hoy);
    if (!r) continue;
    filas.push({
      nombre: a.nombre,
      detalle: a.detalle || '',
      valor: r.valor,
      diferencia: valorReal - r.valor,
      pct: (valorReal - r.valor) / r.valor * 100
    });
  }
  if (!filas.length) return null;

  var invertido = 0;
  for (var k = 0; k < compras.length; k++) invertido += compras[k].ars;

  filas.push({nombre: 'Lo que hiciste', valor: valorReal, diferencia: 0, pct: 0, esTuyo: true});
  filas.sort(function(a, b){ return b.valor - a.valor; });

  var mejor = filas[0];
  return {
    filas: filas,
    invertido: invertido,
    valorReal: valorReal,
    /* ¿Le ganaste a todas? */
    ganasteATodas: !!mejor.esTuyo,
    mejorAlternativa: mejor.esTuyo ? null : mejor,
    desde: compras[0].fecha
  };
}

/* ══════════════ ¿Cuánto puede bajar esto? ══════════════

   La peor caida real desde un maximo, en el periodo que se mire. Es el
   numero que evita vender en panico: ver que ya estuvo 30% abajo y se
   recupero cambia la reaccion cuando vuelve a pasar. */
function peorCaida(serie, desde){
  if (!serie || serie.length < 2) return null;
  var max = null, maxF = null, peor = 0, peorF = null, peorDesde = null;
  for (var i = 0; i < serie.length; i++){
    var p = serie[i];
    if (desde && p.f < desde) continue;
    if (max == null || p.v > max){ max = p.v; maxF = p.f; }
    if (max > 0){
      var caida = (max - p.v) / max * 100;
      if (caida > peor){ peor = caida; peorF = p.f; peorDesde = maxF; }
    }
  }
  if (peor <= 0) return null;
  var ultimo = serie[serie.length - 1];
  return {
    pct: peor,
    fecha: peorF,
    desdeMax: peorDesde,
    /* ¿Se recupero? Comparar el ultimo precio con el maximo previo. */
    recuperado: ultimo.v >= max * 0.995,
    hoy: ultimo.v,
    maximo: max
  };
}

/* Cuanto se movio un papel entre dos fechas, en por ciento. */
function variacionEntre(serie, desde, hasta){
  if (!serie || !serie.length) return null;
  var a = valorEnFecha(serie, desde), b = valorEnFecha(serie, hasta || hoyISO());
  if (!a || !b) return null;
  return (b - a) / a * 100;
}

/* ═══════════ LOGICA PURA — FIN ═══════════ */

/* ══════════════ Historial diario ══════════════ */
function anotarHist(d){
  if (d.posiciones.length === 0) return;
  var hoy = hoyISO();
  var punto = {f:hoy, v:Math.round(d.valorHoy), i:Math.round(d.invertido)};
  var ult = E.hist[E.hist.length - 1];
  if (ult && ult.f === hoy) E.hist[E.hist.length - 1] = punto;
  else E.hist.push(punto);
  if (E.hist.length > 400) E.hist = E.hist.slice(-400);
  guardar();
}

/* ══════════════ De dónde salen los datos ══════════════

   Todo público, todo gratis, todo sin registrarse. La página funciona
   igual si alguna se cae: cada pieza que falta se completa a mano y se
   avisa, nunca se inventa.

   dolarapi.com        → las siete cotizaciones del día
   data912.com         → precios en vivo de CEDEARs y acciones argentinas
   argentinadatos.com  → dólar de todos los días desde 2013, inflación
                         mensual y las tasas de plazo fijo de 32 bancos

   Son proyectos comunitarios, no oficiales. Andan bien y hace años,
   pero no hay nadie obligado a mantenerlos: por eso nada depende de
   que respondan. */
var FUENTES = {
  dolar:     'https://dolarapi.com/v1/dolares',
  cedears:   'https://data912.com/live/arg_cedears',
  acciones:  'https://data912.com/live/arg_stocks',
  cclSerie:  'https://api.argentinadatos.com/v1/cotizaciones/dolares/contadoconliqui',
  /* La misma serie pero de un solo dia: 93 bytes en vez de 526 KB.
     Para una cartera normal alcanza con pedir las fechas de las
     compras, que son un puñado. */
  cclDia:    'https://api.argentinadatos.com/v1/cotizaciones/dolares/contadoconliqui/',
  inflacion: 'https://api.argentinadatos.com/v1/finanzas/indices/inflacion',
  plazoFijo: 'https://api.argentinadatos.com/v1/finanzas/tasas/plazoFijo'
};

/* Lo que sabemos del mundo, más allá de los precios de hoy. */
var MUNDO = {cclSerie: [], inflacion: [], tna: null, cuando: null, estado: 'esperando'};

/* El visor de artefactos de claude.ai bloquea cualquier pedido a otro
   sitio. La pagina anda igual, pero conviene decir por que no llegan
   los datos en vez de dejar un "no se pudo" sin explicacion. */
function enVistaPrevia(){
  try {
    var h = location.hostname || '';
    return h === '' || h.indexOf('claude.ai') >= 0 || location.protocol === 'data:';
  } catch(e){ return false; }
}
var CLAVE_MUNDO = 'micartera_mundo';

function traer(url, seg){
  return new Promise(function(listo, falla){
    if (typeof fetch !== 'function'){ falla(new Error('sin fetch')); return; }
    var corte = setTimeout(function(){ falla(new Error('tardó demasiado')); }, (seg || 15) * 1000);
    fetch(url, {cache: 'no-store'})
      .then(function(r){
        if (!r.ok) throw new Error('respuesta ' + r.status);
        return r.text();
      })
      .then(function(t){ clearTimeout(corte); listo(t); })
      ['catch'](function(e){ clearTimeout(corte); falla(e); });
  });
}

/* ── Precios y dólar de hoy ── */
function traerPrecios(){
  AUTO.estado = 'cargando';

  var guardada = leerCache();
  if (guardada){
    AUTO.precios = mezclarPrecios(guardada.precios, AUTO.precios);
    if (!AUTO.dolar && guardada.dolar) AUTO.dolar = guardada.dolar;
    if (!AUTO.cuando && guardada.cuando) AUTO.cuando = new Date(guardada.cuando);
  }
  render();

  /* El dolar siempre: es chico y sirve aunque no haya nada cargado. */
  var pedidos = [
    traer(FUENTES.dolar, 12).then(function(t){
      var d = leerDolarApi(t);
      if (d && d.ccl){ AUTO.dolar = d.ccl; AUTO.dolarCasas = d; }
    })['catch'](function(){})
  ];

  /* Los precios de la bolsa son 136 KB: sin nada cargado no hay que
     valuar nada, asi que se los ahorra. Llegan cuando cargue algo. */
  if (hayTenencias(E)){
    pedidos.push(traer(FUENTES.cedears, 20).then(function(t){
      AUTO.precios = mezclarPrecios(AUTO.precios, leerData912(t, 'cedear'));
    })['catch'](function(){}));
    pedidos.push(traer(FUENTES.acciones, 20).then(function(t){
      AUTO.precios = mezclarPrecios(AUTO.precios, leerData912(t, 'accion'));
    })['catch'](function(){}));
  }

  /* La planilla propia, si hay una configurada, se suma a lo anterior
     y le gana: son precios que el dueño de la página eligió a mano. */
  if (FUENTE_PRECIOS){
    var url = FUENTE_PRECIOS + (FUENTE_PRECIOS.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
    pedidos.push(traer(url, 20).then(function(t){
      var p = leerPrecios(t);
      if (p.cuantos > 0){
        AUTO.precios = mezclarPrecios(AUTO.precios, p.precios);
        if (p.dolar) AUTO.dolar = p.dolar;
      }
    })['catch'](function(){}));
  }

  Promise.all(pedidos).then(function(){
    AUTO.cuantos = Object.keys(AUTO.precios).length;
    if (AUTO.cuantos > 0 || AUTO.dolar){
      AUTO.cuando = new Date();
      AUTO.estado = 'ok';
      guardarCache();
    } else {
      AUTO.estado = 'falla';
    }
    render();
    /* La inflacion y las tasas solo sirven si hay algo que comparar. */
    if (hayCompras(E)) traerMundo();
  });
}

/* ── El contexto: dólar histórico, inflación, tasas ── */
function traerMundo(){
  var hoy = hoyISO();
  var guardado = null;
  try {
    var crudo = localStorage.getItem(CLAVE_MUNDO);
    if (crudo) guardado = JSON.parse(crudo);
  } catch(e){}

  if (guardado && guardado.dia === hoy && guardado.cclSerie && guardado.cclSerie.length){
    MUNDO.cclSerie = guardado.cclSerie;
    MUNDO.inflacion = guardado.inflacion || [];
    MUNDO.tna = guardado.tna || null;
    MUNDO.cuando = guardado.dia;
    MUNDO.estado = 'ok';
    render();
    return;
  }

  MUNDO.estado = 'cargando';
  render();

  Promise.all([
    traerCCL(),

    traer(FUENTES.inflacion, 20).then(function(t){
      MUNDO.inflacion = recortarSerie(leerSerie(t, 'valor'), primeraCompra(E));
    })['catch'](function(){}),

    traer(FUENTES.plazoFijo, 20).then(function(t){
      MUNDO.tna = medianaTNA(t);
    })['catch'](function(){})
  ]).then(function(){
    MUNDO.estado = (MUNDO.cclSerie.length || MUNDO.inflacion.length || MUNDO.tna) ? 'ok' : 'falla';
    MUNDO.cuando = hoy;
    try {
      localStorage.setItem(CLAVE_MUNDO, JSON.stringify({
        dia: hoy, cclSerie: MUNDO.cclSerie, inflacion: MUNDO.inflacion, tna: MUNDO.tna
      }));
    } catch(e){}
    render();
  });
}

/* El dolar de las fechas que hacen falta.

   Con pocas compras conviene pedir dia por dia: cada respuesta pesa 93
   bytes contra los 526 KB de la serie entera. Con muchas, la serie sale
   mas barata. El corte esta en 25, que es donde se cruzan. */
function traerCCL(){
  var fechas = fechasDeCompra(E);
  if (!fechas.length) return Promise.resolve();

  if (fechas.length > 25){
    return traer(FUENTES.cclSerie, 30).then(function(t){
      MUNDO.cclSerie = recortarSerie(leerSerie(t, 'venta'), primeraCompra(E));
    })['catch'](function(){});
  }

  var pedidos = fechas.map(function(f){ return traerCCLDeUnDia(f, 0); });
  return Promise.all(pedidos).then(function(puntos){
    var buenos = puntos.filter(function(x){ return x; });
    /* Si alguna fecha no se pudo, se cae a la serie entera antes que
       calcular con datos a medias. */
    if (buenos.length < fechas.length){
      return traer(FUENTES.cclSerie, 30).then(function(t){
        MUNDO.cclSerie = recortarSerie(leerSerie(t, 'venta'), primeraCompra(E));
      })['catch'](function(){});
    }
    buenos.sort(function(a, b){ return a.f < b.f ? -1 : 1; });
    MUNDO.cclSerie = buenos;
  });
}

/* Un feriado o un domingo no tienen cotizacion: se prueba con los dias
   anteriores, hasta cuatro, que es mas que cualquier fin de semana largo. */
function traerCCLDeUnDia(fecha, intento){
  if (intento > 4) return Promise.resolve(null);
  var d = new Date(fecha + 'T00:00:00');
  if (intento) d.setDate(d.getDate() - intento);
  var iso = fechaISO(d);
  var url = FUENTES.cclDia + iso.slice(0,4) + '/' + iso.slice(5,7) + '/' + iso.slice(8,10);
  return traer(url, 10).then(function(t){
    var o = JSON.parse(t);
    var v = Number(o && o.venta);
    if (!isFinite(v) || v <= 0) throw new Error('sin valor');
    /* Se guarda bajo la fecha pedida, no la encontrada: es el dolar
       que le corresponde a esa compra. */
    return {f: fecha, v: v};
  })['catch'](function(){ return traerCCLDeUnDia(fecha, intento + 1); });
}

/* ¿Hay algo cargado que valuar? */
function hayTenencias(est){
  return !!(est && est.movimientos && est.movimientos.some(function(m){
    return m.tipo === 'compra' || m.tipo === 'venta';
  }));
}
function hayCompras(est){
  return !!(est && est.movimientos && est.movimientos.some(function(m){
    return m.tipo === 'compra';
  }));
}

/* Las fechas distintas en las que hubo una compra. */
function fechasDeCompra(est){
  var vistas = {}, salida = [];
  if (!est || !est.movimientos) return salida;
  for (var i = 0; i < est.movimientos.length; i++){
    var m = est.movimientos[i];
    if (m.tipo !== 'compra') continue;
    if (typeof m.fecha !== 'string' || vistas[m.fecha]) continue;
    vistas[m.fecha] = 1;
    salida.push(m.fecha);
  }
  return salida;
}

/* La fecha de la primera compra. Más atrás de eso no hace falta nada. */
function primeraCompra(est){
  var min = null;
  if (!est || !est.movimientos) return null;
  for (var i = 0; i < est.movimientos.length; i++){
    var f = est.movimientos[i].fecha;
    if (typeof f === 'string' && (!min || f < min)) min = f;
  }
  return min;
}

/* Guardar doce años de cotizaciones para alguien que empezó hace seis
   meses es tirar medio mega al pedo. Se recorta al mes anterior a la
   primera compra y listo. */
function recortarSerie(serie, desde){
  if (!serie || !serie.length) return [];
  if (!desde) return serie.slice(-400);
  var corte = desde.slice(0, 8) + '01';
  var d = new Date(corte + 'T00:00:00');
  d.setMonth(d.getMonth() - 1);
  var limite = fechaISO(d);
  var i = 0;
  while (i < serie.length && serie[i].f < limite) i++;
  return serie.slice(Math.max(0, i - 1));
}

/* El contexto listo para calcular el resultado de las cuatro formas. */
function contextoMundo(){
  return {
    hoy: hoyISO(),
    cclHoy: dolarDe(E, AUTO),
    cclSerie: MUNDO.cclSerie,
    inflacion: MUNDO.inflacion,
    tna: MUNDO.tna
  };
}

function fechaISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function horaCorta(d){
  if (!d) return '';
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ══════════════ Vistas ══════════════ */
function render(){
  var d = derivar(E, null, AUTO);
  var html = '';
  if (vista === 'resumen') html = vistaResumen(d);
  else if (vista === 'inversiones') html = vistaInversiones(d);
  else if (vista === 'movimientos') html = vistaMovimientos(d);
  else html = vistaAyuda();
  document.getElementById('vista').innerHTML = html;

  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++){
    tabs[i].setAttribute('aria-selected', tabs[i].dataset.tab === vista ? 'true' : 'false');
  }
}

function avisoGuardado(){
  if (puedeGuardar) return '';
  return '<div class="aviso"><span><b>No se puede guardar en este navegador.</b> Si cerrás la página vas a perder lo cargado. Suele pasar en ventanas de incógnito.</span></div>';
}

function vistaResumen(d){

  var h = avisoGuardado();
  var gan = d.ganancia, pos = gan >= 0;
  var clase = pos ? 'pos' : 'neg';
  var flecha = pos ? '▲' : '▼';
  var signo = pos ? '+' : '−';
  var abs = Math.abs(gan);

  h += '<div class="hero">';
  h += '<div class="rotulo">Tus inversiones valen</div>';
  h += '<div class="hero-cifra">' + pesos(d.valorHoy) + '</div>';
  if (d.valorUSD != null){
    h += '<div class="hero-usd">' + dolares(d.valorUSD) + '<span> · con el dólar a ' + pesos(d.dolarHoy) + '</span></div>';
  }
  if (d.invertido > 0){
    h += '<div class="hero-delta"><span class="' + clase + '">' + flecha + ' ' + signo + pesos(abs) + '</span>'
       + '<span class="' + clase + '">' + signo + pct(Math.abs(d.varPct)) + '</span></div>';
    h += '<div class="hero-frase">Pusiste <b>' + pesos(d.invertido) + '</b> y hoy eso vale <b>' + pesos(d.valorHoy) + '</b>. '
       + (Math.abs(gan) < 1 ? 'Estás justo a la par.' : (pos ? 'Ganaste <b>' + pesos(abs) + '</b>.' : 'Perdés <b>' + pesos(abs) + '</b>.'))
       + '</div>';
    if (d.valorUSD != null){
      h += '<details class="explic"><summary>¿Por qué me muestra también los dólares?</summary>'
        + '<p>Porque en Argentina ganar en pesos y ganar de verdad no son lo mismo. '
        + 'Si tus inversiones subieron 40% pero el dólar subió 55%, en pesos tenés más pero comprás menos: '
        + 'perdiste. Mirar las dos cifras juntas es la forma más rápida de no confundirte. '
        + 'El dólar que uso sale de comparar empresas que cotizan acá y en Estados Unidos al mismo tiempo.</p></details>';
    }
  }
  h += '</div>';

  if (d.faltanPrecios > 0){
    h += '<div class="aviso"><span><b>Falta el precio de hoy de ' + d.faltanPrecios + ' ' + (d.faltanPrecios === 1 ? 'inversión' : 'inversiones') + '.</b> '
       + 'Mientras tanto ' + (d.faltanPrecios === 1 ? 'esa cuenta' : 'esas cuentan') + ' por lo que pagaste, así que el total de arriba se queda corto.</span>'
       + '<button data-tab="inversiones">Cargarlos</button></div>';
  }

  h += '<div class="pila">';

  if (E.hist.length >= 2){
    h += '<div class="tarjeta"><div class="rotulo">Cómo viene</div>' + grafico() + '</div>';
  }

  h += tarjetaResultado(d);
  h += '<div class="tarjeta"><div class="rotulo">En qué está repartida</div>' + composicion(d) + '</div>';

  h += '<div class="tarjeta"><div class="rotulo">La plata de la cuenta</div>'
     + '<div class="dato" style="padding-top:10px"><span>Pusiste en total</span><span>' + pesos(d.aportado) + '</span></div>'
     + '<div class="dato"><span>Invertido</span><span>' + pesos(d.invertido) + '</span></div>'
     + '<div class="dato"><span>Sin invertir, en la cuenta</span><span>' + pesos(d.efectivo)
     + (d.efectivoUSD != null ? ' <span class="chico">· ' + dolares(d.efectivoUSD) + '</span>' : '') + '</span></div>'
     + (Math.abs(d.realizado) > 0.5 ? '<div class="dato"><span>Ganado en lo que ya vendiste</span><span class="' + (d.realizado >= 0 ? 'pos' : 'neg') + '">' + (d.realizado >= 0 ? '+' : '−') + pesos(Math.abs(d.realizado)) + '</span></div>' : '')
     + bloqueComisiones()
     + bloqueQuieto(d)
     + '<details class="explic"><summary>¿Por qué me muestra plata sin invertir?</summary>'
     + '<p>Es la plata que entró a tu cuenta de inversión y todavía no compró nada. Está ahí quieta: no rinde y la inflación se la come. Si te aparece un número grande acá, puede ser que te falte cargar alguna compra, o que tengas plata esperando.</p></details>'
     + '</div>';

  h += '</div>';
  return h;
}

function composicion(d){
  /* Un color por tenencia, no por tipo: si alguien tiene ocho CEDEARs
     todos salian del mismo color y la barra no decia nada. El gris
     queda reservado para la plata sin invertir. */
  var PALETA = ['--c1','--c2','--c3','--c4','--c5','--c6'];
  var items = d.posiciones.map(function(q, i){
    return {nom:q.nombre, clase:q.clase, val:(q.tienePrecio ? q.valor : q.costo),
            col:'var(' + PALETA[i % PALETA.length] + ')'};
  });
  if (d.efectivo > 1){
    items.push({nom:'Sin invertir', clase:null, val:d.efectivo, col:'var(--c7)'});
  }
  var total = items.reduce(function(a,b){ return a + b.val; }, 0);
  if (total <= 0) return '<p class="chico">Todavía no hay nada cargado.</p>';

  var barras = items.map(function(it){
    var p = it.val / total * 100;
    return '<i style="width:' + p.toFixed(2) + '%; background:' + it.col + '" title="' + esc(it.nom) + '"></i>';
  }).join('');

  var filas = items.map(function(it){
    var p = it.val / total * 100;
    return '<div class="leyenda-fila">'
      + '<span class="punto" style="background:' + it.col + '"></span>'
      + '<span class="leyenda-nom">' + esc(it.nom)
        + ((it.clase && CLASES[it.clase].nom !== it.nom) ? ' <span class="chico">· ' + esc(CLASES[it.clase].nom) + '</span>' : '')
        + '</span>'
      + '<span class="leyenda-pct">' + pct(p) + '</span>'
      + '<span class="leyenda-val">' + pesos(it.val) + '</span>'
      + '</div>';
  }).join('');

  var mayor = items.slice().sort(function(a,b){ return b.val - a.val; })[0];
  var pMayor = mayor.val / total * 100;
  var nota = pMayor > 40
    ? '<details class="explic"><summary>Tenés bastante concentrado en una sola cosa</summary><p><b>' + esc(mayor.nom) + '</b> es el ' + pct(pMayor) + ' de todo lo que tenés. No está mal en sí mismo, pero significa que si a esa inversión le va mal, te va mal a vos. Repartir entre varias cosas distintas es la forma más barata de bajar ese riesgo.</p></details>'
    : '';

  return '<div class="compo">' + barras + '</div>' + filas + nota;
}

function grafico(){
  var pts = E.hist.slice(-60);
  if (pts.length < 2) return '';
  var W = 600, H = 160, mI = 8, mD = 8, mT = 16, mB = 22;
  var vals = pts.map(function(p){ return p.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max === min){ max = max * 1.02 + 1; min = min * 0.98 - 1; }
  var x = function(i){ return mI + (i / (pts.length - 1)) * (W - mI - mD); };
  var y = function(v){ return mT + (1 - (v - min) / (max - min)) * (H - mT - mB); };

  var linea = pts.map(function(p,i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  var area = linea + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H - mB) + ' L' + x(0).toFixed(1) + ' ' + (H - mB) + ' Z';
  var sube = pts[pts.length-1].v >= pts[0].v;
  var col = sube ? 'var(--pos)' : 'var(--neg)';

  return '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolución de lo que vale tu cartera">'
    + '<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.18"/>'
    + '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>'
    + '<path d="' + area + '" fill="url(#gr)"/>'
    + '<path d="' + linea + '" fill="none" stroke="' + col + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="' + x(pts.length-1).toFixed(1) + '" cy="' + y(pts[pts.length-1].v).toFixed(1) + '" r="4" fill="' + col + '"/>'
    + '<text x="' + mI + '" y="' + (H - 6) + '" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif">' + fechaCorta(pts[0].f) + '</text>'
    + '<text x="' + (W - mD) + '" y="' + (H - 6) + '" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif" text-anchor="end">' + fechaCorta(pts[pts.length-1].f) + '</text>'
    + '<text x="' + mI + '" y="12" fill="var(--muted)" font-size="12" font-family="Figtree,sans-serif">Máximo ' + pesos(max) + '</text>'
    + '</svg>'
    + '<p class="chico" style="margin-top:6px">Se anota un punto cada día que abrís la página.</p>';
}

function vistaInversiones(d){
  if (d.posiciones.length === 0){
    return franjaPrecios()
      + '<div class="pila"><div class="tarjeta"><div class="vacio"><h3>Todavía no cargaste nada</h3>'

      + tarjetaDolar() + '</div>';
  }

  var h = franjaPrecios();

  if (hayUSD){
    h += '<div class="tarjeta" style="margin-top:16px">';

      /* Ya lo muestra el panel de abajo con todas las cotizaciones. */
